<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
      /* Brand */
      --red: #E50914;
      --red-dark: #B00710;
      --green: #46d369;
      /* Backgrounds */
      --bg: #141414;
      --bg2: #0a0a0a;
      --card: #1c1c1c;
      --card2: #242424;
      /* Text / Border */
      --text: #e5e5e5;
      --muted: #808080;
      --border: rgba(255,255,255,.08);
      /* Spacing scale */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px;
      --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
      /* Radius scale */
      --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-full: 50%;
      /* Shadows */
      --shadow-card: 0 8px 32px rgba(0,0,0,.7);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
      /* Breakpoint scale (Task 6) — reference values used consistently across
         @media queries site-wide. CSS vars can't be used inside @media
         conditions, so this is the documented source of truth: use these
         literal px values in @media rules instead of ad-hoc numbers.
           --bp-xs   480px  → small phones
           --bp-sm   640px  → phones / mobile nav switch
           --bp-md  1024px  → tablets (portrait/landscape)
           --bp-lg  1440px  → laptops / small desktops
           --bp-xl  1920px  → large desktop
         */
      /* Site-wide content gutter — caps main content width on ultra-wide
         monitors (~1900px, like Netflix) instead of stretching edge-to-edge.
         Below that width it behaves exactly like the old flat 4% padding. */
      --content-max: 1900px;
      --content-pad: max(4%, calc((100% - var(--content-max)) / 2));
    }
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:66px;display:flex;align-items:center;padding:0 var(--content-pad);gap:0;background:rgba(8,8,8,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--red);letter-spacing:2px;margin-right:28px;cursor:pointer;text-decoration:none;flex-shrink:0}
.logo span{color:#fff}
.nav-links{display:flex;gap:2px;list-style:none}
.nl{color:rgba(255,255,255,.68);font-size:.86rem;font-weight:500;padding:6px 12px;border-radius:4px;transition:all .2s;cursor:pointer;white-space:nowrap;border:none;background:none;font-family:'Barlow',sans-serif}
.nl:hover{color:#fff;background:rgba(255,255,255,.07)}
.nl.active{color:#fff;font-weight:700}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-av{width:30px;height:30px;border-radius:4px;background:linear-gradient(135deg,var(--red),#831010);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;cursor:pointer;color:#fff;overflow:hidden;border:2px solid transparent;transition:border-color .2s;flex-shrink:0}
.nav-av:hover{border-color:rgba(255,255,255,.5)}
.nav-av img{width:100%;height:100%;object-fit:cover}
.nav-bell{background:none;border:none;color:rgba(255,255,255,.72);cursor:pointer;width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:all .2s;position:relative;flex-shrink:0}
.nav-bell:hover{background:rgba(255,255,255,.09);color:#fff}
#pageWrap{padding-top:66px}
.mob-cat-tabs{display:none}
@media(max-width:640px){
  .mob-cat-tabs{display:flex;gap:8px;padding:12px var(--content-pad) 10px;overflow-x:auto;scrollbar-width:none;
    position:sticky;top:66px;z-index:150;background:rgba(8,8,8,.97);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08)}
  .mob-cat-tabs::-webkit-scrollbar{display:none}
  .mct-item{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);color:rgba(255,255,255,.7);font-size:.78rem;font-weight:600;
    font-family:'Barlow',sans-serif;cursor:pointer;white-space:nowrap;transition:.15s;
    -webkit-tap-highlight-color:transparent}
  .mct-item.active{background:#fff;color:#000;border-color:#fff}
}
/* PAGE TABS */
.pg-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 var(--content-pad);background:var(--bg);position:sticky;top:66px;z-index:100;overflow-x:auto;scrollbar-width:none}
.pg-tabs::-webkit-scrollbar{display:none}
.ptab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:.88rem;font-weight:600;padding:14px 18px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;margin-bottom:-1px;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.active{color:#fff;border-bottom-color:var(--red)}
/* HERO */
.pg-hero{position:relative;height:390px;overflow:hidden}
.h-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.h-grad{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.88) 0%,rgba(0,0,0,.3) 55%,transparent 100%),linear-gradient(to top,rgba(20,20,20,1) 0%,transparent 45%)}
.h-c{position:relative;z-index:2;padding:0 var(--content-pad);display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding-bottom:28px}
.h-badge{display:inline-flex;align-items:center;background:rgba(229,9,20,.88);color:#fff;font-size:.6rem;font-weight:800;padding:3px 10px;border-radius:3px;letter-spacing:1.5px;margin-bottom:11px;width:fit-content}
.h-title{font-family:'Bebas Neue',cursive;font-size:clamp(2rem,4.5vw,3.5rem);color:#fff;letter-spacing:2px;line-height:1;margin-bottom:9px}
.h-meta{display:flex;align-items:center;gap:11px;margin-bottom:9px;flex-wrap:wrap;font-size:.8rem}
.h-match{color:var(--green);font-weight:700}
.h-cert{border:1px solid rgba(255,255,255,.42);padding:1px 5px;border-radius:2px;color:rgba(255,255,255,.78)}
.h-ov{font-size:.84rem;color:rgba(255,255,255,.72);line-height:1.5;max-width:460px;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h-btns{display:flex;gap:9px;flex-wrap:wrap}
.btn-p{background:#fff;color:#000;border:none;padding:9px 22px;font-size:.88rem;font-weight:800;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-p:hover{background:#d4d4d4}
.btn-i{background:rgba(109,109,110,.65);color:#fff;border:none;padding:9px 18px;font-size:.88rem;font-weight:700;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;backdrop-filter:blur(4px);transition:background .2s}
.btn-i:hover{background:rgba(109,109,110,.88)}
/* GENRE PILLS */
.gpstrip{display:flex;gap:7px;padding:14px var(--content-pad);overflow-x:auto;scrollbar-width:none}
.gpstrip::-webkit-scrollbar{display:none}
.gp{background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.7);padding:6px 15px;border-radius:20px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;white-space:nowrap;flex-shrink:0}
.gp:hover{background:rgba(255,255,255,.13);color:#fff}
.gp.on{background:#fff;color:#000;border-color:#fff}
/* FILTER ROW */
.frow{display:flex;align-items:center;gap:8px;padding:0 var(--content-pad) 14px;flex-wrap:wrap}
.flbl{font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.fsel{background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.76);padding:6px 12px;border-radius:6px;font-size:.76rem;font-family:'Barlow',sans-serif;cursor:pointer;outline:none}
.fsel option{background:#1c1c1c}
.fsp{flex:1}
.rcnt{font-size:.74rem;color:var(--muted)}
.vtog{display:flex;gap:3px}
.vb{background:none;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.vb.on,.vb:hover{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.2)}
/* CONTENT */
.cont{padding:0 var(--content-pad) 60px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.st{font-size:1.04rem;font-weight:700;color:#fff}
.sb{background:rgba(229,9,20,.14);color:var(--red);font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:3px;margin-left:6px;letter-spacing:.5px}
/* CARD GRID */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:30px}
@media(max-width:1024px) and (min-width:641px){
  /* Tablet (Task 7): a bit tighter than desktop's 150px minimum so the
     grid doesn't look sparse on a tablet-width screen. */
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
}
@media(min-width:1440px){
  /* Large desktop (Task 9): cards grow, not just column count */
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
}
@media(min-width:1920px){
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:12px}
}
.cgrid.lm{grid-template-columns:1fr;gap:5px}
/* Poster/list card styling moved to the shared XCard component
   (xwerse-config.js → XCard.injectStyles()) — see .xc-card / .xc-row.
   .t10c/.t10n/.t10p below stay: still used by the New & Popular
   section's own markup, separate from buildT10(). */
.lacts{display:flex;gap:5px;align-items:center;padding:0 11px;flex-shrink:0}
.lb{background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.66);width:27px;height:27px;border-radius:50%;cursor:pointer;font-size:.74rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.lb:hover{background:rgba(255,255,255,.13);color:#fff}
/* TOP 10 */
.t10w{display:flex;gap:0;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin-bottom:30px}
.t10w::-webkit-scrollbar{display:none}
.t10c{flex-shrink:0;display:flex;align-items:flex-end;cursor:pointer;transition:transform .2s}
.t10c:hover{transform:scale(1.04);z-index:3}
.t10n{font-family:'Bebas Neue',cursive;font-size:6.5rem;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.15);line-height:1;margin-right:-17px;z-index:1;flex-shrink:0;transition:-webkit-text-stroke-color .2s}
.t10c:hover .t10n{-webkit-text-stroke-color:rgba(255,255,255,.38)}
.t10p{width:94px;height:138px;border-radius:4px;object-fit:cover;background:#222;z-index:2;position:relative;border:1px solid var(--border)}
/* NP */
.npl{display:flex;flex-direction:column;gap:1px;margin-bottom:30px}
.npc{display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--border);cursor:pointer;transition:background .18s}
.npc:first-child{border-radius:7px 7px 0 0}
.npc:last-child{border-radius:0 0 7px 7px;border-bottom:none}
.npc:hover{background:#222}
.nprk{width:48px;font-family:'Bebas Neue',cursive;font-size:1.5rem;color:rgba(255,255,255,.15);text-align:center;flex-shrink:0}
.npth{width:88px;height:50px;object-fit:cover;flex-shrink:0;background:#222}
.npif{flex:1;padding:10px 13px;min-width:0}
.nptl{font-size:.86rem;font-weight:700;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npmt{font-size:.68rem;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.npnew{background:rgba(70,211,105,.14);color:var(--green);font-size:.56rem;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.5px}
.nphot{background:rgba(229,9,20,.12);color:var(--red);font-size:.56rem;font-weight:700;padding:1px 5px;border-radius:3px}
.npact{display:flex;gap:6px;align-items:center;padding-right:13px;opacity:0;transition:opacity .2s}
.npc:hover .npact{opacity:1}
.npb{background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.76rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.npb:hover{background:rgba(255,255,255,.15)}
/* LANG GRID */
.lgg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;margin-bottom:40px}
/* LOAD MORE */
.lm-btn{display:block;width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:rgba(255,255,255,.68);padding:12px;font-size:.84rem;font-weight:600;border-radius:6px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;text-align:center;margin-bottom:22px}
.lm-btn:hover{background:rgba(255,255,255,.11);color:#fff}
/* SKELETON */
.sk{background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%);background-size:200% 100%;animation:ska 1.4s infinite;border-radius:4px}
@keyframes ska{0%{background-position:200%}100%{background-position:-200%}}
/* ── EPISODE PICKER ── */
.ep-wrap{border-top:1px solid rgba(255,255,255,.08);margin-top:18px;padding-top:16px}
.ep-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.ep-hd-title{font-size:.9rem;font-weight:700;color:#fff}
.ep-season-sel{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);color:#fff;padding:6px 12px;border-radius:6px;font-size:.78rem;font-family:'Barlow',sans-serif;cursor:pointer;outline:none;transition:border .2s}
.ep-season-sel:focus{border-color:rgba(255,255,255,.35)}
.ep-season-sel option{background:#1a1a1a}
.ep-list{display:flex;flex-direction:column;gap:2px}
.ep-item{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-radius:6px;cursor:pointer;transition:background .18s;border:1px solid transparent}
.ep-item:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
.ep-num-badge{flex-shrink:0;width:28px;text-align:center;font-family:'Bebas Neue',cursive;font-size:1.4rem;color:rgba(255,255,255,.3);line-height:1;margin-top:8px}
.ep-thumb{flex-shrink:0;width:110px;height:62px;border-radius:5px;overflow:hidden;background:#222;position:relative}
.ep-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .18s}
.ep-item:hover .ep-thumb img{filter:brightness(.65)}
.ep-play-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s;background:rgba(0,0,0,.28)}
.ep-item:hover .ep-play-icon{opacity:1}
.ep-play-icon div{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#000;font-size:.8rem}
.ep-thumb-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;background:#1c1c1c}
.ep-info{flex:1;min-width:0}
.ep-title-row{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.ep-title{font-size:.84rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-runtime{font-size:.7rem;color:var(--muted);flex-shrink:0}
.ep-overview{font-size:.73rem;color:rgba(255,255,255,.5);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.ep-loading{padding:20px;text-align:center;color:var(--muted);font-size:.84rem}
.ep-skel{background:linear-gradient(90deg,#222 25%,#282828 50%,#222 75%);background-size:200% 100%;animation:skelA 1.4s infinite;border-radius:4px}
@keyframes skelA{to{background-position:-200% 0}}
@media(max-width:640px){.ep-thumb{width:80px;height:46px}}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.mbg.open{display:flex;animation:mfi .22s ease}
@keyframes mfi{from{opacity:0}to{opacity:1}}
.mo{background:#181818;border:1px solid rgba(255,255,255,.1);border-radius:10px;width:min(96vw,560px);max-height:90vh;overflow-y:auto;animation:msu .28s ease}
@keyframes msu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.mh{position:relative;height:210px;overflow:hidden}
.modal-drag-handle{display:none}
.mh img{width:100%;height:100%;object-fit:cover;display:block}
.mhg{position:absolute;inset:0;background:linear-gradient(to top,#181818 0%,transparent 55%)}
.mx{position:absolute;top:11px;right:11px;background:rgba(0,0,0,.6);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.86rem;display:flex;align-items:center;justify-content:center}
.mx:hover{background:rgba(0,0,0,.88)}
.mb{padding:14px 20px 26px}
.mt{font-family:'Bebas Neue',cursive;font-size:1.6rem;color:#fff;letter-spacing:1px;margin-bottom:7px}
.mm{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px;font-size:.76rem}
.mmt{color:var(--green);font-weight:700}
.mce{border:1px solid rgba(255,255,255,.38);padding:1px 5px;border-radius:2px;color:rgba(255,255,255,.7)}
.mov{font-size:.83rem;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:14px}
.mac{display:flex;gap:9px;flex-wrap:wrap}
.mpl{background:#fff;color:#000;border:none;padding:9px 22px;font-size:.86rem;font-weight:800;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;display:flex;align-items:center;gap:6px;transition:background .2s}
.mpl:hover{background:#d4d4d4}
.mad{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.22);padding:9px 18px;font-size:.86rem;font-weight:700;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s}
.mad:hover{background:rgba(255,255,255,.17)}
/* PAGE SECTIONS */
.bpg{display:none}
.bpg.active{display:block}
@media(max-width:640px){.nav-links{display:none}.cgrid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:7px}.t10n{font-size:5rem}.t10p{width:76px;height:112px}main,#mainContent{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))!important}
  .mbg{padding:0;align-items:flex-end;background:rgba(0,0,0,.4)}
  .mo{width:100%;max-width:none;height:100%;max-height:100%;border-radius:0;border:none;animation:msuFull .28s cubic-bezier(.32,.72,0,1)}

  .modal-drag-handle{display:flex;align-items:center;justify-content:center;height:26px;cursor:grab;touch-action:none}

}
@keyframes msuFull{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* ── MOBILE BOTTOM NAV ────────────────────────────────── */
.mob-nav{display:none}

<script>
let currentUser = null;
let tvData=[], movData=[], npItems=[];
let tvV='grid', movV='grid';
let tvPage=0, movPage=0;
let tvF={lang:'',genre:'',sort:''}, movF={lang:'',genre:'',sort:''};
const PS=20;
// ── REAL FILTERS ─────────────────────────────────────────────
// TMDB list items carry no genre/language, so filtering the small loaded list
// showed "0 titles". Instead, when a filter is active we ask TMDB "discover"
// for exactly that language/genre, and merge in matching titles from our DB.
const GENRE_IDS = {
  tv:    {'Drama':18,'Action':10759,'Comedy':35,'Crime':80,'Mystery':9648,'Sci-Fi & Fantasy':10765,'Animation':16,'Reality':10764,'Family':10751,'Documentary':99},
  movie: {'Action':28,'Drama':18,'Comedy':35,'Horror':27,'Sci-Fi':878,'Romance':10749,'Thriller':53,'Animation':16,'Crime':80}
};
const LANG_PILLS = {'Hindi':'hi','Telugu':'te','Tamil':'ta','Korean':'ko'};
const _dcache = {};
const _dtoken = {tv:0, movie:0};
const _remote = {tv:null, movie:null};

function _filterActive(F){ return !!(F.lang || F.genre); }

async function _discover(kind, F){
  const key = kind+'|'+F.lang+'|'+F.genre+'|'+F.sort;
  if (_dcache[key]) return _dcache[key];
  const today = new Date().toISOString().slice(0,10);
  const ids = [];
  if (F.genre && GENRE_IDS[kind][F.genre]) ids.push(GENRE_IDS[kind][F.genre]);
  if (F.lang === 'ja' && kind === 'tv') ids.push(16);          // Anime tab = Japanese animation
  const p = { sort_by:'popularity.desc', include_adult:'false' };
  if (F.lang) p.with_original_language = F.lang;
  if (ids.length) p.with_genres = ids.join(',');
  if (F.sort === 'rating') { p.sort_by = 'vote_average.desc'; p['vote_count.gte'] = 200; }
  if (F.sort === 'year') {
    if (kind === 'tv') { p.sort_by = 'first_air_date.desc'; p['first_air_date.lte'] = today; }
    else               { p.sort_by = 'primary_release_date.desc'; p['primary_release_date.lte'] = today; }
    p['vote_count.gte'] = 20;
  }
  const path = kind === 'tv' ? '/discover/tv' : '/discover/movie';
  const pages = await Promise.all([1,2,3].map(n => TMDB.fetch(path, Object.assign({page:n}, p))));
  const seen = {}, out = [];
  pages.forEach(r => (r && r.results || []).forEach(it => {
    if (!it.poster_path || seen[it.id]) return;
    seen[it.id] = 1; out.push(TMDB.normalize(it));
  }));
  _dcache[key] = out;
  return out;
}

function _dbMatches(m, F, kind){
  if (F.lang) {
    const l = m.language || m.original_language || m.lang || '';
    if (l !== F.lang) return false;
  }
  if (F.genre) {
    const want = F.genre.toLowerCase().split(' ')[0];
    const g = m.genres || m.genre || [];
    if (!g.some(x => String(typeof x === 'string' ? x : (x && x.name) || '').toLowerCase().indexOf(want) !== -1)) return false;
  }
  return true;
}

// Called whenever a filter or the sort changes (kind = 'tv' | 'movie')
async function applyFilters(kind){
  const F = kind === 'tv' ? tvF : movF;
  const tok = ++_dtoken[kind];
  if (!_filterActive(F)) { _remote[kind] = null; kind === 'tv' ? renderTV() : renderMov(); return; }
  const grid = document.getElementById(kind === 'tv' ? 'tvGrid' : 'movGrid');
  grid.className = 'cgrid';
  grid.innerHTML = skelG(20);
  let list = [];
  try { list = await _discover(kind, F); } catch (e) { list = []; }
  if (tok !== _dtoken[kind]) return;          // a newer click superseded this one
  _remote[kind] = list;
  kind === 'tv' ? renderTV() : renderMov();
}

function _collect(kind, F, base){
  if (!_filterActive(F)) return [...base];
  const rem = _remote[kind] || [];
  const dbHits = base.filter(m => m.id && _dbMatches(m, F, kind));
  const seen = {}; const out = [];
  dbHits.concat(rem).forEach(m => { const k = m.tmdb_id || m.id; if (seen[k]) return; seen[k] = 1; out.push(m); });
  return out;
}

const TVGENRES=['All','Drama','Action','Comedy','Crime','Mystery','Sci-Fi & Fantasy','Animation','Reality','Family','Documentary'];
const MOVGENRES=['All','Action','Drama','Comedy','Horror','Sci-Fi','Romance','Thriller','Animation','Crime','Hindi','Telugu','Tamil'];
const LANGS=[{code:'hi',name:'Hindi',icon:'🇮🇳',count:1800,bg:'#5c1a1a'},{code:'en',name:'English',icon:'🇬🇧',count:4200,bg:'#1a3a5c'},{code:'te',name:'Telugu',icon:'🎭',count:650,bg:'#3a3a1a'},{code:'ta',name:'Tamil',icon:'🌺',count:580,bg:'#1a3a2a'},{code:'kn',name:'Kannada',icon:'🦁',count:320,bg:'#2a1a3a'},{code:'ml',name:'Malayalam',icon:'🌴',count:410,bg:'#1a2a3a'},{code:'ko',name:'Korean',icon:'🇰🇷',count:730,bg:'#1a1a5c'},{code:'ja',name:'Japanese',icon:'🇯🇵',count:890,bg:'#3a1a1a'}];

// ── MOVIE REGISTRY ─────────────────────────────────────
// Stores movie objects by short key. All card onclick handlers
// pass only the key (never JSON) so special chars can't crash.
const _MR = new Map(); let _mrSeq = 0;
function _reg(m){
  var k = m.id ? ('d'+m.id) : m.tmdb_id ? ('t'+m.tmdb_id) : ('s'+(++_mrSeq));
  _MR.set(k, m); return k;
}
function _get(k){ return _MR.get(k)||null; }
// Play or open modal based on type — avoids inline ternary in onclick
function _pc(el){ var m=_get(el.dataset.mk); if(!m) return; if(el.dataset.tv==='1') openMod(m); else play(m); }
function _ac(el){ var m=_get(el.dataset.mk); if(m) addML(m); }
// ───────────────────────────────────────────────────────

(async()=>{
  currentUser = await requireAuth(); if(!currentUser) return;
  await initNavAvatar('navAvatar');
  await initNavAvatar('mnavProfileAvatar');   // mobile bottom-nav Profile tab (Task: real-Netflix mobile nav)
  if (typeof XvNotif !== 'undefined') XvNotif.init(currentUser.id);
  await ML.init(currentUser.id);   // ← centralized My List state
  Ratings.injectStyles();
  await Ratings.init(currentUser.id);
  const hash = location.hash.replace('#','') || 'tv';
  switchPage(hash);

  // Task 14: live sync — if My List changes elsewhere (another tab/device),
  // refresh the already-loaded TV/Movie grids so heart icons stay accurate.
  RT.init(currentUser.id, {
    onMyListChange: async () => { await ML.init(currentUser.id); renderTV(); renderMov(); },
  });
})();

function switchPage(pg){
  document.querySelectorAll('.bpg').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('[id^="nl"]').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.mnav-item').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.mct-item').forEach(b=>b.classList.remove('active'));
  const p=document.getElementById('pg-'+pg), l=document.getElementById('nl'+pg[0].toUpperCase()+pg.slice(1));
  const mnMap={tv:'mnavNewHot',movies:'mnavNewHot',new:'mnavNewHot',languages:'mnavNewHot'};
  const mctMap={tv:'mctTV',movies:'mctMovies',new:'mctNew',languages:'mctLanguages'};
  const mn=document.getElementById(mnMap[pg]);
  const mct=document.getElementById(mctMap[pg]);
  if(p) p.classList.add('active'); if(l) l.classList.add('active'); if(mn) mn.classList.add('active'); if(mct) mct.classList.add('active');
  location.hash=pg;
  if(pg==='tv' && !tvData.length) loadTV();
  if(pg==='movies' && !movData.length) loadMovies();
  if(pg==='new' && !npItems.length) loadNP('watching');
  if(pg==='languages' && !document.getElementById('langG').children.length) buildLangs();
}

// ── TV ────────────────────────────────────
async function loadTV(){
  document.getElementById('tvGrid').innerHTML = skelG(20);
  const [dbTV,tmdbPop,tmdbTop] = await Promise.all([
    DB.getMovies({type:'tv',limit:50}).then(r=>r.data||[]),
    TMDB.popularTV(), TMDB.topTV()
  ]);
  const norm = arr => (arr?.results||[]).filter(m=>m.poster_path).map(TMDB.normalize);
  const tnorm = norm(tmdbPop), ttop = norm(tmdbTop);
  tvData = [...dbTV, ...tnorm.filter(t=>!dbTV.find(d=>d.tmdb_id===t.tmdb_id))];
  const hero = tvData.find(m=>m.backdrop_url)||tnorm[0];
  if(hero) setHero('tv',hero);
  buildT10('tvT10', ttop.slice(0,10));
  buildPills('tvGP', TVGENRES, g=>{ tvF.genre=g==='All'?'':g; tvPage=0; applyFilters('tv'); });
  renderTV();
}
function renderTV(){
  let d=_collect('tv',tvF,tvData);
  if(tvF.sort==='rating') d.sort((a,b)=>(b.rating||b.vote_average||0)-(a.rating||a.vote_average||0));
  if(tvF.sort==='alpha') d.sort((a,b)=>a.title.localeCompare(b.title));
  if(tvF.sort==='year') d.sort((a,b)=>(b.year||'')>(a.year||'')?1:-1);
  const pg=d.slice(0,PS*(tvPage+1));
  document.getElementById('tvCnt').textContent=d.length+' titles';
  document.getElementById('tvGrid').className='cgrid'+(tvV==='list'?' lm':'');
  document.getElementById('tvGrid').innerHTML=pg.map(m=>cHTML(m,tvV==='list')).join('');
  document.getElementById('tvLM').style.display=d.length>pg.length?'block':'none';
}
function tvTab(lang,btn){ document.querySelectorAll('#pg-tv .ptab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); tvF.lang=lang; tvPage=0; applyFilters('tv'); }
function sortTV(s){ tvF.sort=s; tvPage=0; applyFilters('tv'); }

// ── MOVIES ────────────────────────────────
async function loadMovies(){
  document.getElementById('movGrid').innerHTML=skelG(20);
  const [dbMov,tmdbPop,tmdbTop]=await Promise.all([
    DB.getMovies({type:'movie',limit:50}).then(r=>r.data||[]),
    TMDB.popularMov(), TMDB.topMovies()
  ]);
  const norm=arr=>(arr?.results||[]).filter(m=>m.poster_path).map(TMDB.normalize);
  const tnorm=norm(tmdbPop), ttop=norm(tmdbTop);
  movData=[...dbMov,...tnorm.filter(t=>!dbMov.find(d=>d.tmdb_id===t.tmdb_id))];
  const hero=movData.find(m=>m.backdrop_url)||tnorm[0];
  if(hero) setHero('mov',hero);
  buildT10('movT10',ttop.slice(0,10));
  buildPills('movGP',MOVGENRES,g=>{ if(LANG_PILLS[g]){ movF.lang=LANG_PILLS[g]; movF.genre=''; } else { movF.genre=g==='All'?'':g; if(g==='All') movF.lang=''; } movPage=0; applyFilters('movie'); });
  renderMov();
}
function renderMov(){
  let d=_collect('movie',movF,movData);
  if(movF.sort==='rating') d.sort((a,b)=>(b.rating||b.vote_average||0)-(a.rating||a.vote_average||0));
  if(movF.sort==='alpha') d.sort((a,b)=>a.title.localeCompare(b.title));
  if(movF.sort==='year') d.sort((a,b)=>(b.year||'')>(a.year||'')?1:-1);
  const pg=d.slice(0,PS*(movPage+1));
  document.getElementById('movCnt').textContent=d.length+' titles';
  document.getElementById('movGrid').className='cgrid'+(movV==='list'?' lm':'');
  document.getElementById('movGrid').innerHTML=pg.map(m=>cHTML(m,movV==='list')).join('');
  document.getElementById('movLM').style.display=d.length>pg.length?'block':'none';
}
function sortMov(s){ movF.sort=s; movPage=0; applyFilters('movie'); }
function filterMovL(l){ movF.lang=l; movPage=0; applyFilters('movie'); }
function loadMore(t){ if(t==='tv'){tvPage++;renderTV();}else{movPage++;renderMov();} }
function setV(t,v,btn){ if(t==='tv'){tvV=v;document.querySelectorAll('#pg-tv .vb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderTV();}else{movV=v;document.querySelectorAll('#pg-movies .vb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderMov();} }

// ── NEW & POPULAR ─────────────────────────
async function loadNP(tab){
  const c=document.getElementById('npCont'); c.innerHTML=skelG(12);
  const [tr,up]=await Promise.all([TMDB.trending(),TMDB.upcoming()]);
  npItems=[...(tr?.results||[]),...(up?.results||[])].filter(m=>m.poster_path).map(TMDB.normalize);
  renderNP(tab);
}
function npSwitch(t,btn){ document.querySelectorAll('#pg-new .ptab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderNP(t); }
function renderNP(tab){
  var c=document.getElementById('npCont');
  if(!npItems.length){c.innerHTML=skelG(12);return;}
  if(tab==='top10'){
    var h='<div class="t10w">';
    for(var i=0;i<Math.min(10,npItems.length);i++){
      var m=npItems[i], k=_reg(m);
      h+='<div class="t10c" data-mk="'+k+'" onclick="openMod(_get(this.dataset.mk))"><div class="t10n">'+(i+1)+'</div><img class="t10p" src="'+(m.poster_url||'')+'" alt="" loading="lazy"></div>';
    }
    c.innerHTML=h+'</div>'; return;
  }
  var items=tab==='new'?[].concat(npItems).rewerse():npItems;
  var h='<div class="npl">';
  for(var i=0;i<Math.min(25,items.length);i++){
    var m=items[i], k=_reg(m);
    var inML=ML.has(m.id), mlLbl=inML?'&#10003;':'+';
    var isTV=m.type==='tv'?'1':'0';
    var badge=i<4?'<span class="npnew">NEW</span>':i<10?'<span class="nphot">&#128293;</span>':'';
    h+='<div class="npc" data-mk="'+k+'" onclick="openMod(_get(this.dataset.mk))">'
      +'<div class="nprk">'+(i+1)+'</div>'
      +'<img class="npth" src="'+(m.poster_url||'')+'" alt="" loading="lazy">'
      +'<div class="npif"><div class="nptl">'+m.title+'</div>'
      +'<div class="npmt"><span>'+(m.year||'')+'</span>'
      +'<span style="color:var(--green)">&#9733; '+(m.rating||m.vote_average||'')+'</span>'+badge+'</div></div>'
      +'<div class="npact">'
      +'<button class="npb" data-mk="'+k+'" data-tv="'+isTV+'" onclick="event.stopPropagation();_pc(this)">&#9654;</button>'
      +'<button class="npb" data-mk="'+k+'" onclick="event.stopPropagation();_ac(this)">'+mlLbl+'</button>'
      +'</div></div>';
  }
  c.innerHTML=h+'</div>';
}

// ── LANGUAGES ─────────────────────────────
function buildLangs(){
  document.getElementById('langG').innerHTML=LANGS.map(l=>`<div onclick="switchPage('movies');filterMovL('${l.code}')" style="background:linear-gradient(135deg,${l.bg} 0%,rgba(255,255,255,.04) 100%);border:1px solid var(--border);border-radius:9px;padding:20px 16px;cursor:pointer;transition:border-color .2s;display:flex;align-items:center;justify-content:space-between" onmouseover="this.style.borderColor='rgba(255,255,255,.26)'" onmouseout="this.style.borderColor='var(--border)'"><div><div style="font-size:1.6rem;margin-bottom:6px">${l.icon}</div><div style="font-size:.95rem;font-weight:700;color:#fff;margin-bottom:2px">${l.name}</div><div style="font-size:.7rem;color:rgba(255,255,255,.38)">${l.count.toLocaleString()} titles</div></div><div style="font-size:.8rem;color:rgba(255,255,255,.25)">›</div></div>`).join('');
}

// ── HERO ──────────────────────────────────
function setHero(type,m){
  var bg=document.getElementById(type+'Bg'), hc=document.getElementById(type+'HeroC');
  if(bg && (m.backdrop_url||m.poster_url)) bg.style.backgroundImage='url('+( m.backdrop_url||m.poster_url)+')';
  if(!hc) return;
  var match=Math.round(65+parseFloat(m.rating||m.vote_average||7)*3.5);
  var k=_reg(m), isTV=m.type==='tv'?'1':'0';
  hc.innerHTML='<div class="h-badge">&#9733; TOP PICK</div>'
    +'<div class="h-title">'+m.title+'</div>'
    +'<div class="h-meta"><span class="h-match">'+match+'% Match</span>'
    +'<span>'+(m.year||'')+'</span><span class="h-cert">'+(m.age_rating||'UA')+'</span>'
    +(m.quality?'<span style="background:rgba(70,211,105,.12);color:var(--green);font-size:.64rem;font-weight:700;padding:2px 6px;border-radius:3px">'+m.quality+'</span>':'')
    +'</div><div class="h-ov">'+(m.overview||'')+'</div>'
    +'<div class="h-btns">'
    +'<button class="btn-p" data-mk="'+k+'" data-tv="'+isTV+'" onclick="_pc(this)">&#9654; Play</button>'
    +'<button class="btn-i" data-mk="'+k+'" onclick="openMod(_get(this.dataset.mk))">&#9432; Info</button>'
    +'</div>';
}

// ── PILL REGISTRY — CSP-safe, no eval ─────────────────────────
const _pillCB = {};
function _pill(id, val) {
  if (_pillCB[id]) _pillCB[id](val);
  document.querySelectorAll('[data-pid="'+id+'"]').forEach(function(b){
    b.classList.toggle('on', b.dataset.val === val);
  });
}
function buildPills(id, list, cb) {
  _pillCB[id] = cb;
  var el = document.getElementById(id); if (!el) return;
  var h = '';
  for (var i = 0; i < list.length; i++) {
    h += '<button class="gp'+(i===0?' on':'')+'" data-pid="'+id+'" data-val="'
       + list[i]+'" onclick="_pill(this.dataset.pid,this.dataset.val)">'+list[i]+'</button>';
  }
  el.innerHTML = h;
}

// ── SKELETON ──────────────────────────────────────────────────
function skelG(n) {
  var h = '';
  for (var i = 0; i < n; i++) {
    h += '<div class="card sk"><div style="width:100%;padding-top:150%;position:relative">'
       + '<div style="position:absolute;inset:0;background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%);'
       + 'background-size:200% 100%;animation:ska 1.4s ease infinite;border-radius:4px"></div></div></div>';
  }
  return h;
}

// ── CARD HTML ─────────────────────────────────────────────────
// Thin delegate to the shared XCard component (see xwerse-config.js).
// Same cHTML(m, isList) signature as before so every call site
// (renderTV, renderMov, renderNP, ...) needs no other changes.
// play(m) already redirects TV titles to the modal internally,
// so a single onPlay handler covers both movies and TV.
function cHTML(m, isList) {
  var opts = {
    onOpen: 'openMod',
    onPlay: 'play',
    action: { type: 'add', inList: ML.has(m.id), onToggle: 'addML' },
  };
  return isList ? XCard.row(m, opts) : XCard.poster(m, opts);
}

// ── TOP 10 ────────────────────────────────────────────────────
function buildT10(elId, items) {
  var h = '';
  for (var i = 0; i < items.length; i++) {
    h += XCard.top10(items[i], i, { onOpen: 'openMod' });
  }
  var el = document.getElementById(elId);
  if (el) el.innerHTML = h;
}

// ── MODAL — uses existing HTML IDs from the page ──────────────
// IDs in HTML: modBg, modImg, modTit, modMeta, modOv,
//              mPlayBtn, mAddBtn, bEpWrap, bEpSeasonSel, bEpList
var _curMovie = null;

function openMod(m) {
  if (!m) return;
  _curMovie = m;
  var _si = document.getElementById('shareIco'); if (_si) _si.innerHTML = XShare.ICON;
  document.body.style.overflow = 'hidden';
  var isTV = m.type === 'tv', k = _reg(m), tvF = isTV ? '1' : '0';
  var match = Math.round(65 + parseFloat(m.rating || m.vote_average || 7) * 3.5);
  var inML = ML.has(m.id);

  // Fill modal elements
  var imgEl = document.getElementById('modImg');
  if (imgEl) imgEl.src = m.backdrop_url || m.poster_url || '';

  var titEl = document.getElementById('modTit');
  if (titEl) titEl.textContent = m.title || '';

  var metaEl = document.getElementById('modMeta');
  if (metaEl) metaEl.innerHTML =
    '<span class="mmt">'+match+'% Match</span>'
    +(m.year ? '<span>'+m.year+'</span>' : '')
    +(m.age_rating ? '<span class="mce">'+m.age_rating+'</span>' : '')
    +'<span>'+(isTV ? 'TV Show' : 'Movie')+'</span>'
    +(m.quality ? '<span style="background:rgba(70,211,105,.12);color:var(--green);font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:3px">'+m.quality+'</span>' : '');

  var ovEl = document.getElementById('modOv');
  if (ovEl) ovEl.textContent = m.overview || '';

  // Play button
  var playBtn = document.getElementById('mPlayBtn');
  if (playBtn) {
    playBtn.dataset.mk = k; playBtn.dataset.tv = tvF;
    playBtn.textContent = isTV ? '▶ Play S1 E1' : '▶ Play';
    playBtn.onclick = function() {
      if (_curMovie && _curMovie.type === 'tv') bPlayEp(1, 1); else play(_curMovie);
    };
  }

  // My List button
  var mlBtn = document.getElementById('mAddBtn');
  var thumbsEl = document.getElementById('mThumbsSlot');
  if (thumbsEl) thumbsEl.innerHTML = m.tmdb_id ? Ratings.thumbsHTML(m.tmdb_id, m.type) : '';
  if (mlBtn) {
    mlBtn.innerHTML = inML ? '&#10003; In My List' : '＋ My List';
    mlBtn.onclick = async function() {
      var r = await ML.toggle(_curMovie);
      if (r === null) return;
      this.innerHTML = r ? '&#10003; In My List' : '＋ My List';
      document.querySelectorAll('[data-mk="'+k+'"]').forEach(function(el){
        if (el.classList.contains('cad') || el.classList.contains('lb'))
          el.innerHTML = r ? '&#10003;' : '+';
      });
    };
  }

  // Episode picker visibility
  var epWrap = document.getElementById('bEpWrap');
  if (epWrap) {
    epWrap.style.display = isTV ? 'block' : 'none';
    if (isTV && m.tmdb_id) bLoadSeasons(m);
  }

  SwipeSheet.attach(document.getElementById('modalDragHandle'), document.getElementById('modCard'), closeMod);
  document.getElementById('modBg').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeMod() {
  var bg = document.getElementById('modBg');
  if (bg) bg.classList.remove('open');
  document.body.style.overflow = '';
  _curMovie = null;
}

// ── EPISODE LOADER ────────────────────────────────────────────
async function bLoadSeasons(m) {
  var sel = document.getElementById('bEpSeasonSel');
  var list = document.getElementById('bEpList');
  if (!sel || !list) return;
  sel.innerHTML = ''; list.innerHTML = '<div style="padding:12px;color:rgba(255,255,255,.4);font-size:.8rem">Loading...</div>';
  try {
    var d = await TMDB.tvDetails(m.tmdb_id);
    var seasons = (d.seasons||[]).filter(function(s){ return s.season_number > 0; });
    if (!seasons.length) { list.innerHTML='<div style="padding:12px;color:rgba(255,255,255,.4);font-size:.8rem">No seasons found.</div>'; return; }
    sel.innerHTML = seasons.map(function(s){
      return '<option value="'+s.season_number+'">Season '+s.season_number+' ('+s.episode_count+' eps)</option>';
    }).join('');
    bLoadEpisodes(1);
  } catch(e) { list.innerHTML = '<div style="padding:12px;color:rgba(255,255,255,.4);font-size:.8rem">Could not load.</div>'; }
}

async function bLoadEpisodes(season) {
  var list = document.getElementById('bEpList');
  if (!list || !_curMovie) return;
  list.innerHTML = '<div style="padding:12px;color:rgba(255,255,255,.4);font-size:.8rem">Loading episodes...</div>';
  try {
    var d = await TMDB.fetch('/tv/'+_curMovie.tmdb_id+'/season/'+season);
    var eps = d.episodes || [];
    if (!eps.length) { list.innerHTML='<div style="padding:12px;color:rgba(255,255,255,.4);font-size:.8rem">No episodes.</div>'; return; }
    var sn = parseInt(season), h = '';
    for (var i = 0; i < eps.length; i++) {
      var ep = eps[i], en = ep.episode_number;
      var thumb = ep.still_path ? 'https://image.tmdb.org/t/p/w300'+ep.still_path : '';
      h += '<div class="ep-row" onclick="bPlayEp('+sn+','+en+')">'
        + '<div class="ep-num">'+en+'</div>'
        + '<div class="ep-thumb">'
        + (thumb ? '<img src="'+thumb+'" alt="" loading="lazy"><div class="ep-play">&#9654;</div>' : '<div class="ep-nothumb">&#9654;</div>')
        + '</div>'
        + '<div class="ep-info"><div class="ep-title-row">'
        + '<span class="ep-name">'+(ep.name||'Episode '+en)+'</span>'
        + (ep.runtime ? '<span class="ep-rt">'+ep.runtime+'m</span>' : '')
        + '</div>'
        + (ep.overview ? '<div class="ep-ov">'+ep.overview.slice(0,120)+(ep.overview.length>120?'...':'')+'</div>' : '')
        + '</div></div>';
    }
    list.innerHTML = h;
  } catch(e) { list.innerHTML = '<div style="padding:12px;color:rgba(255,255,255,.4);font-size:.8rem">Could not load episodes.</div>'; }
}

function bPlayEp(season, episode) {
  var m = _curMovie; if (!m) return;
  var p = new URLSearchParams();
  if (m.id) p.set('id', m.id);
  if (m.tmdb_id) p.set('tmdb_id', m.tmdb_id);
  p.set('type','tv'); p.set('season',season); p.set('episode',episode);
  p.set('title',m.title||''); p.set('year',m.year||'');
  p.set('poster',m.poster_url||''); p.set('backdrop',m.backdrop_url||'');
  p.set('age',m.age_rating||''); p.set('quality',m.quality||'');
  if (m.embed_url) p.set('embed',m.embed_url);
  closeMod();
  window.location.href = '/Player?'+p.toString();
}

// ── PLAY ──────────────────────────────────────────────────────
function play(m) {
  if (!m) return;
  if (m.type === 'tv') { openMod(m); return; }
  var p = new URLSearchParams();
  if (m.id) p.set('id', m.id);
  if (m.tmdb_id) p.set('tmdb_id', m.tmdb_id);
  p.set('type', m.type||'movie'); p.set('title',m.title||''); p.set('year',m.year||'');
  p.set('poster',m.poster_url||''); p.set('backdrop',m.backdrop_url||'');
  p.set('age',m.age_rating||''); p.set('dur',m.duration||'');
  p.set('quality',m.quality||'');
  if (m.embed_url) p.set('embed',m.embed_url);
  window.location.href = '/Player?'+p.toString();
}

// ── ADD TO MY LIST ────────────────────────────────────────────
async function addML(m) {
  if (!m) return;
  var result = await ML.toggle(m);
  if (result === null) return;
  var pg = document.querySelector('.bpg.active');
  if (!pg) return;
  var pgId = pg.id.replace('pg-','');
  if (pgId==='tv') renderTV();
  else if (pgId==='movies') renderMov();
  else if (pgId==='new') {
    var at = document.querySelector('#pg-new .ptab.active');
    renderNP(at&&at.textContent.indexOf('Top')>=0?'top10':at&&at.textContent.indexOf('New')>=0?'new':'watching');
  }
}

document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeMod(); });
</script>
