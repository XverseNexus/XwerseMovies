<style>
:root{ --red:#E50914; }
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  width:100%; height:100%; height:100dvh;
  background:#000; overflow:hidden;
  font-family:'Barlow',sans-serif; color:#fff;
  position:fixed; overscroll-behavior:none;
}

/* ── PLAYER WRAPPER ─────────────────────────────────────── */
#playerWrap{
  position:relative; width:100vw; height:100vh; height:100dvh;
  background:#000; overflow:hidden;
}

/* ── EMBED IFRAME (Voe / Filemoon / VidSrc) ─────────────────
   Full screen, no scaling tricks: the host's own player is
   responsive and owns every control (seek, volume, quality,
   subtitles, fullscreen). We just stay out of its way.        */
#stFrame{
  position:absolute; inset:0; width:100%; height:100%;
  border:none; z-index:1; display:none; background:#000;
}

/* ── DIRECT STREAM (Plyr / HTML5 <video>) ───────────────── */
#dvWrap{
  position:absolute; inset:0; z-index:2; display:none; background:#000;
  --plyr-color-main:#E50914;
}
#dvWrap .plyr{
  width:100%; height:100%;
  --plyr-font-family:'Barlow',system-ui,sans-serif;
  --plyr-control-radius:4px;
  --plyr-control-icon-size:20px;
  --plyr-range-thumb-background:#E50914;
  --plyr-video-control-background-hover:rgba(229,9,20,.9);
  --plyr-video-controls-background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.85));
  --plyr-menu-background:rgba(20,20,20,.96);
  --plyr-menu-color:#fff;
  --plyr-menu-radius:6px;
  --plyr-tooltip-background:#141414;
  --plyr-tooltip-color:#fff;
  --plyr-video-progress-buffered-background:rgba(255,255,255,.3);
}
#dvWrap .plyr--video .plyr__control--overlaid{ background:rgba(229,9,20,.92); }
#dvWrap .plyr--video .plyr__control--overlaid:hover{ background:#E50914; }
#dvWrap .plyr__badge{ background:#E50914; color:#fff; }
#dvWrap video{ width:100%; height:100%; object-fit:contain; background:#000; }

/* ── LOADING SCREEN ─────────────────────────────────────── */
#loadScreen{
  position:absolute; inset:0; z-index:20; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  transition:opacity .35s ease;
}
#loadScreen.hide{ opacity:0; pointer-events:none; }
.ld-logo{ font-family:'Bebas Neue',cursive; font-size:2.8rem; color:#E50914; letter-spacing:2px; }
.ld-logo span{ color:#fff; }
.ld-bar{ width:220px; height:3px; background:#222; overflow:hidden; border-radius:3px; }
.ld-fill{ width:40%; height:100%; background:#E50914; animation:ldSlide 1.2s ease-in-out infinite; }
@keyframes ldSlide{ from{ transform:translateX(-100%); } to{ transform:translateX(250%); } }
.ld-msg{ color:#777; font-size:.8rem; text-align:center; padding:0 20px; line-height:1.5; }
#ldActions{ display:none; gap:10px; margin-top:4px; }
#ldActions.show{ display:flex; }
.ld-btn{
  background:#E50914; color:#fff; border:none; border-radius:4px;
  padding:10px 20px; font:700 .85rem 'Barlow',sans-serif; cursor:pointer;
}
.ld-btn.ghost{ background:rgba(255,255,255,.12); }
.ld-btn:hover{ filter:brightness(1.15); }

/* ── TOP OVERLAY: back button, title, next episode ──────────
   The container never captures clicks; only the buttons do, so
   the embedded player receives every other tap/click.
   Buttons idle at low opacity; title + gradient show on load
   (and with Plyr's controls) then fade away.                  */
#topUI{
  position:absolute; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:center; gap:12px;
  padding:max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left));
  pointer-events:none;
}
#topUI::before{
  content:''; position:absolute; inset:0 0 -26px 0; z-index:-1;
  background:linear-gradient(to bottom, rgba(0,0,0,.78), transparent);
  opacity:0; transition:opacity .3s; pointer-events:none;
}
#playerWrap.ui-on #topUI::before{ opacity:1; }

.ui-btn{
  pointer-events:auto; flex-shrink:0;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.22); color:#fff;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  opacity:.4; transition:opacity .25s, background .15s;
}
.ui-btn:hover, .ui-btn:focus-visible, #playerWrap.ui-on .ui-btn{ opacity:1; }
.ui-btn:hover{ background:rgba(255,255,255,.16); }

#backBtn{ width:42px; height:42px; border-radius:50%; font-size:1.15rem; }
#nextEpBtn{
  display:none; height:38px; padding:0 14px; border-radius:6px;
  font:700 .8rem 'Barlow',sans-serif; gap:6px; white-space:nowrap;
}

#titleBox{ flex:1; min-width:0; opacity:0; transition:opacity .3s; pointer-events:none; }
#playerWrap.ui-on #titleBox{ opacity:1; }
.top-title{ font-size:1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 4px rgba(0,0,0,.8); }
.top-sub{ font-size:.72rem; color:rgba(255,255,255,.65); text-shadow:0 1px 4px rgba(0,0,0,.8); }

/* ── ROTATE HINT (phones in portrait, embed mode) ───────── */
#hint{
  position:absolute; left:50%; bottom:max(28px, env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:31; background:rgba(0,0,0,.78); border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.85); padding:8px 16px; border-radius:20px;
  font-size:.74rem; white-space:nowrap; opacity:0; transition:opacity .4s; pointer-events:none;
}
#hint.show{ opacity:1; }
</style>

  <!-- LOADING -->

</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
<script>
'use strict';

let currentUser = null;
let movieData   = null;
let uiTimer     = null;
let syncTimer   = null;
let _isDirect   = false;   // true once the built-in (Plyr) player is in use
let _dv         = null;    // the <video> element in direct mode
let _plyr       = null;
let _hls        = null;

const $ = (id) => document.getElementById(id);

/* ─────────────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────────────── */
(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;

  const p          = new URLSearchParams(location.search);
  const movieId    = p.get('id');
  const urlSeason  = parseInt(p.get('season'))  || 1;
  const urlEpisode = parseInt(p.get('episode')) || 1;

  let movie = null;
  if (movieId) movie = await DB.getMovie(parseInt(movieId));

  if (!movie) {
    movie = {
      id:          movieId ? parseInt(movieId) : null,
      tmdb_id:     p.get('tmdb_id')  ? parseInt(p.get('tmdb_id')) : null,
      title:       p.get('title')    || 'Movie',
      type:        p.get('type')     || 'movie',
      year:        p.get('year')     || '',
      quality:     p.get('quality')  || '',
      age_rating:  p.get('age')      || 'UA',
      duration:    p.get('dur')      || '',
      embed_url:   p.get('embed')    || '',
      poster_url:  p.get('poster')   || '',
      backdrop_url:p.get('backdrop') || '',
    };
  }

  movie._season  = urlSeason;
  movie._episode = urlEpisode;
  movieData = movie;

  if (movie.tmdb_id) {
    // Personal fulfilled-request override (see xwerse-config.js:
    // DB.getMyRequestOverride for how this stays scoped to just this user).
    const myOverride = await DB.getMyRequestOverride(currentUser.id, movie.tmdb_id, movie.type, urlSeason);
    if (myOverride) {
      if (movie.type === 'tv') movie._myLinks = myOverride;      // per-episode links (see Xwerse.pickEpisodeLink)
      else movie.embed_url = myOverride;
    }
  }

  // Direct-stream request (opened from My Requests): ownership + payment are
  // re-checked here via RLS-protected query; the link itself is never in the URL.
  const reqParam = p.get('req');
  if (reqParam) {
    movie._reqId = reqParam;
    const direct = await DB.getMyDirectStream(currentUser.id, reqParam);
    if (direct) movie.direct_url = direct;
    else movie._directDenied = true;
  }

  loadVideo(movie);

  if (movie.id && !movie._directDenied) {
    DB.addToHistory(currentUser.id, movie.id).catch(() => {});
    DB.incrementViews(movie.id).catch(() => {});
    // Embed mode: we cannot read the host player's position, so just record
    // "started watching" once. Direct mode reports real progress (see below).
    if (!_isDirect) syncProgress();
  }
})();

/* ─────────────────────────────────────────────────────────
   TOP OVERLAY (title + gradient): show, then fade after 4s.
   In direct mode it follows Plyr's own controls instead.
───────────────────────────────────────────────────────── */
function openMenu() {
  $('playerWrap').classList.add('ui-on');
  clearTimeout(uiTimer);
  if (!_plyr) uiTimer = setTimeout(closeMenu, 4000);
}
function closeMenu() {
  clearTimeout(uiTimer);
  $('playerWrap').classList.remove('ui-on');
}
$('backBtn').addEventListener('mouseenter', openMenu);

/* ─────────────────────────────────────────────────────────
   LOADING SCREEN helpers
───────────────────────────────────────────────────────── */
let _loadStart = Date.now();
let _slowT = null, _hardT = null;

function hideLoader() {
  clearTimeout(_slowT); clearTimeout(_hardT);
  const wait = Math.max(0, 700 - (Date.now() - _loadStart));   // avoid a flash
  setTimeout(() => {
    const ls = $('loadScreen');
    ls.classList.add('hide');
    setTimeout(() => { ls.style.display = 'none'; }, 400);
    openMenu();
  }, wait);
}

function showLoaderError(html, color) {
  clearTimeout(_slowT); clearTimeout(_hardT);
  const ls = $('loadScreen');
  ls.style.display = 'flex';
  ls.classList.remove('hide');
  const msg = $('ldMsg');
  msg.innerHTML = html;
  msg.style.color = color || '#ff6b6b';
  document.querySelector('.ld-bar').style.display = 'none';
}

function retryLoad() {
  const f = $('stFrame');
  $('ldActions').classList.remove('show');
  $('ldMsg').textContent = 'Loading video...';
  $('ldMsg').style.color = '';
  _loadStart = Date.now();
  watchEmbed(f, f.src);
}

// Wait for the embed to actually load; offer Retry / Back if it is slow.
function watchEmbed(frame, url) {
  clearTimeout(_slowT); clearTimeout(_hardT);
  frame.addEventListener('load', hideLoader, { once: true });
  frame.src = url;
  _slowT = setTimeout(() => {
    $('ldMsg').textContent = 'Taking longer than usual…';
    $('ldActions').classList.add('show');
  }, 10000);
  _hardT = setTimeout(hideLoader, 25000);   // never leave the user stuck behind the loader
}

/* ─────────────────────────────────────────────────────────
   DIRECT STREAM — video bytes go straight from the host to the
   viewer's browser. Plyr gives the Netflix-style control bar.
───────────────────────────────────────────────────────── */
const HLS_JS_URL = 'https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js';

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    if (window.Hls) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('script blocked: ' + src));
    document.head.appendChild(s);
  });
}

function loadDirect(m) {
  if (!m.direct_url) {
    showLoaderError('🔒 This video is only available to the account that requested it,<br>' +
         '<span style="font-size:.72rem;color:#888">once the request is paid and completed.</span>');
    return;
  }

  _isDirect = true;
  $('dvWrap').style.display = 'block';
  const v = $('dvVideo');
  _dv = v;

  const posKey = 'xv_pos_' + (m._reqId || (m.id ? 'm' + m.id : m.direct_url.slice(-40)))
                 + (m.type === 'tv' ? '_s' + (m._season || 1) + 'e' + (m._episode || 1) : '');
  let startAt = 0;
  try { startAt = parseFloat(localStorage.getItem(posKey)) || 0; } catch (e) {}

  const isHls = /\.m3u8(\?|#|$)/i.test(m.direct_url);
  let failed = false;

  const showError = () => {
    failed = true;
    showLoaderError('⚠️ Could not load this video.<br>' +
         '<span style="font-size:.72rem;color:#888">Please refresh. If it keeps happening, contact support from the Contact page.</span>');
    $('ldActions').classList.add('show');
  };

  // qualities: array of heights (e.g. [1080,720,480]) → adds Auto + manual menu
  function buildPlayer(qualities) {
    if (typeof Plyr === 'undefined') { v.controls = true; return; } // CDN blocked → native controls
    const opts = {
      controls: ['play-large','rewind','play','fast-forward','progress','current-time','duration',
                 'mute','volume','settings','pip','airplay','fullscreen'],
      settings: qualities && qualities.length ? ['quality','speed'] : ['speed'],
      seekTime: 10,
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
      fullscreen: { enabled: true, iosNative: true, container: '#playerWrap' },
      keyboard: { focused: true, global: true },
      tooltips: { controls: true, seek: true },
      clickToPlay: true,
      i18n: { rewind: 'Back 10s', fastForward: 'Forward 10s', qualityLabel: { 0: 'Auto' } },
      iconUrl: 'https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.svg',
    };
    if (qualities && qualities.length) {
      opts.quality = {
        default: 0,
        options: [0].concat(qualities),
        forced: true,
        onChange: (q) => {
          if (!_hls) return;
          if (q === 0) { _hls.currentLevel = -1; return; }     // Auto (adaptive)
          const idx = _hls.levels.findIndex(l => l.height === q);
          if (idx >= 0) _hls.currentLevel = idx;
        },
      };
    }
    _plyr = new Plyr(v, opts);

    // Title + back button follow Plyr's control bar (Netflix behaviour)
    _plyr.on('controlsshown',  () => $('playerWrap').classList.add('ui-on'));
    _plyr.on('controlshidden', () => $('playerWrap').classList.remove('ui-on'));
    $('playerWrap').classList.add('ui-on');

    // "Auto" shows the quality it is currently playing, e.g. Auto · 720p
    if (_hls && qualities && qualities.length) {
      _hls.on(Hls.Events.LEVEL_SWITCHED, (_e, d) => {
        try {
          if (!_hls.autoLevelEnabled) return;
          const h = _hls.levels[d.level] && _hls.levels[d.level].height;
          const el = document.querySelector('#dvWrap [data-plyr="quality"][value="0"] span');
          if (el && h) el.textContent = 'Auto · ' + h + 'p';
        } catch (e) {}
      });
    }
  }

  // ── common <video> listeners ─────────────────────────────
  let lastSaved = 0;
  v.addEventListener('loadedmetadata', () => {
    if (startAt > 5 && v.duration && startAt < v.duration - 15) v.currentTime = startAt;
  }, { once: true });
  v.addEventListener('canplay', hideLoader, { once: true });
  v.addEventListener('timeupdate', () => {
    const now = Date.now();
    if (now - lastSaved < 5000) return;
    lastSaved = now;
    try { localStorage.setItem(posKey, String(v.currentTime)); } catch (e) {}
  });
  v.addEventListener('pause', () => syncProgress());
  v.addEventListener('ended', () => {
    try { localStorage.removeItem(posKey); } catch (e) {}
    syncProgress();
  });
  v.addEventListener('error', () => { if (!isHls) showError(); });

  // Real progress → Continue Watching (every 15s while playing)
  syncTimer = setInterval(() => { if (!v.paused) syncProgress(); }, 15000);

  // ── source ───────────────────────────────────────────────
  if (!isHls) {
    buildPlayer(null);
    v.src = m.direct_url;
  } else {
    loadScriptOnce(HLS_JS_URL).then(() => {
      if (window.Hls && Hls.isSupported()) {
        _hls = new Hls({
          capLevelToPlayerSize: true,   // don't pull 1080p into a small window
          maxBufferLength: 30,
          startLevel: -1,
        });
        _hls.on(Hls.Events.MANIFEST_PARSED, () => {
          const hs = Array.from(new Set(_hls.levels.map(l => l.height).filter(Boolean))).sort((a, b) => b - a);
          buildPlayer(hs);
        });
        // Fatal errors: retry a few times (flaky network), then show the message.
        let netTry = 0, mediaTry = 0;
        _hls.on(Hls.Events.FRAG_LOADED, () => { netTry = 0; });
        _hls.on(Hls.Events.ERROR, (_e, d) => {
          if (!d.fatal) return;
          if (d.type === Hls.ErrorTypes.NETWORK_ERROR && d.details !== 'manifestLoadError' && ++netTry <= 4) {
            setTimeout(() => _hls && _hls.startLoad(), 1000 * netTry);
          } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && ++mediaTry <= 2) {
            _hls.recoverMediaError();
          } else { _hls.destroy(); _hls = null; showError(); }
        });
        _hls.loadSource(m.direct_url);
        _hls.attachMedia(v);
      } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
        buildPlayer(null);            // iPhone Safari: native HLS (auto quality)
        v.src = m.direct_url;
      } else {
        showError();
      }
    }).catch(showError);
  }

  // Safety net: if canplay never fires (slow host), still reveal the player.
  setTimeout(() => { if (!failed) hideLoader(); }, 8000);
}

/* ─────────────────────────────────────────────────────────
   LOAD VIDEO
───────────────────────────────────────────────────────── */
function loadVideo(m) {
  const season  = m._season  || 1;
  const episode = m._episode || 1;
  const isTV    = m.type === 'tv';

  $('topTitle').textContent = m.title;
  $('topSub').textContent   = isTV ? 'Season ' + season + ' · Episode ' + episode : (m.year || '');

  document.title = isTV
    ? m.title + ' S' + season + 'E' + episode + ' — XwerseMovies'
    : m.title + ' — XwerseMovies';

  // TV shows get a manual "Next Ep" button (we can't know when an embed ends,
  // so there is no auto-jump).
  $('nextEpBtn').style.display = isTV ? 'flex' : 'none';

  // Direct-stream request → built-in HTML5 player, no iframe at all
  if (m.direct_url || m._directDenied) { loadDirect(m); return; }

  // Embed URL priority — DIFFERS for movies vs TV shows:
  //
  // MOVIES: DB override → URL param → auto-build from TMDB (VidSrc)
  // TV SHOWS: ALWAYS auto-build from tmdb_id + season + episode, because one
  //   static embed_url can't represent more than one episode.
  const dbEmbed  = (m.embed_url && m.embed_url.trim()) ? m.embed_url.trim() : null;
  const urlEmbed = (m.embedUrl  && m.embedUrl.trim())  ? m.embedUrl.trim()  : null;
  let   embedUrl = null;

  // Paid Season/Series request: this user's own link for THIS episode wins.
  const myEp = (isTV && m._myLinks) ? Xwerse.pickEpisodeLink(m._myLinks, season, episode) : null;

  if (myEp) {
    embedUrl = myEp;
  } else if (isTV) {
    const tid = m.tmdb_id || null;
    if (tid && m.auto_embed !== false) {
      embedUrl = 'https://vidsrc.to/embed/tv/' + tid + '/' + season + '/' + episode;
    } else {
      embedUrl = dbEmbed || urlEmbed;
    }
  } else {
    embedUrl = dbEmbed || urlEmbed;
    if (!embedUrl) {
      const tid = m.tmdb_id || null;
      if (tid && m.auto_embed !== false) {
        embedUrl = 'https://vidsrc.to/embed/movie/' + tid;
      }
    }
  }

  // A movie whose custom URL is a direct video file / HLS playlist plays in the
  // built-in Netflix-style player (no iframe). Anything else stays an embed.
  if ((!isTV || myEp) && embedUrl && /\.(m3u8|mp4|webm)(\?|#|$)/i.test(embedUrl)) {
    m.direct_url = embedUrl;
    loadDirect(m);
    return;
  }

  if (m.embed_working === false && !m.manual_embed) {
    $('ldMsg').innerHTML =
      '⚠️ This video may be unavailable.<br>' +
      '<span style="font-size:.72rem;color:#888">Set a custom embed in the admin panel.</span>';
    $('ldMsg').style.color = '#f5c518';
    if (!embedUrl) return;
  }

  if (!embedUrl) {
    showLoaderError('⚠️ Video URL not found.<br>' +
      '<span style="font-size:.72rem;color:#888">Set the embed URL in the admin panel.</span>');
    return;
  }

  const frame = $('stFrame');
  frame.style.display = 'block';
  _loadStart = Date.now();
  watchEmbed(frame, embedUrl);

  // Phones held upright: suggest landscape once per session.
  try {
    if (window.innerWidth < 768 && window.innerHeight > window.innerWidth && !sessionStorage.getItem('xv_rot')) {
      sessionStorage.setItem('xv_rot', '1');
      setTimeout(() => {
        const h = $('hint');
        h.classList.add('show');
        setTimeout(() => h.classList.remove('show'), 3500);
      }, 1500);
    }
  } catch (e) {}
}

/* ─────────────────────────────────────────────────────────
   BACK
───────────────────────────────────────────────────────── */
async function goBack() {
  clearInterval(syncTimer);
  if (_isDirect) { try { await syncProgress(); } catch (e) {} }
  if (document.referrer && document.referrer.includes('XwerseMovies')) {
    history.back();
  } else {
    location.href = 'XwerseMovies_Home.html';
  }
}

/* ─────────────────────────────────────────────────────────
   PROGRESS → Continue Watching
   Direct mode : real currentTime / duration.
   Embed mode  : cross-origin, so only a "started" marker (1s).
───────────────────────────────────────────────────────── */
function durMins(d) {
  if (!d) return 0;
  const s = String(d);
  const h = /(\d+)\s*h/i.exec(s), mm = /(\d+)\s*m/i.exec(s);
  if (h || mm) return (h ? +h[1] * 60 : 0) + (mm ? +mm[1] : 0);
  const n = parseInt(s);
  return n > 0 ? n : 0;
}

async function syncProgress() {
  if (!currentUser || !movieData?.id) return;

  let prog, dur;
  if (_isDirect) {
    if (!_dv || !isFinite(_dv.duration) || _dv.duration <= 0) return;
    prog = Math.floor(_dv.currentTime);
    dur  = Math.floor(_dv.duration);
  } else {
    prog = 1;
    dur  = (durMins(movieData.duration) || 90) * 60;
  }

  const extra = movieData.type === 'tv'
    ? { season: movieData._season || 1, episode: movieData._episode || 1 }
    : {};

  try { await DB.upsertContinueWatching(currentUser.id, movieData.id, prog, dur, extra); } catch (e) {}
}

/* ─────────────────────────────────────────────────────────
   NEXT EPISODE (TV only) — manual button, always reliable
───────────────────────────────────────────────────────── */
function doPlayNextEp() {
  if (!movieData) return;
  const params = new URLSearchParams(location.search);
  params.set('episode', (movieData._episode || 1) + 1);
  params.set('season',  movieData._season || 1);
  params.delete('embed');   // force auto-build embed for the new episode
  location.href = 'XwerseMovies_Player.html?' + params.toString();
}

/* ─────────────────────────────────────────────────────────
   KEYBOARD: Esc = back (but not when Esc was just closing fullscreen)
───────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  goBack();
});

/* ─────────────────────────────────────────────────────────
   CLEANUP
───────────────────────────────────────────────────────── */
window.addEventListener('pagehide', () => {
  clearInterval(syncTimer);
  clearTimeout(uiTimer); clearTimeout(_slowT); clearTimeout(_hardT);
  if (_isDirect) syncProgress();
  if (_hls) { try { _hls.destroy(); } catch (e) {} }
});
</script>

    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
