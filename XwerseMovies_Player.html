<script>
'use strict';

let currentUser = null;
let movieData   = null;
// isInML removed — use ML.has(movieData.id) instead
let uiTimer     = null;
let syncTimer   = null;
let watchStart  = null;

/* ─────────────────────────────────────────────────────────
   FIX #2 — IFRAME SCALE TRICK (PRIMARY FIX)

   Root cause: Embedded players (VidSrc, etc.) detect the
   iframe's internal window.innerWidth to decide which UI
   to render. On a 360px mobile screen, width < 768px →
   simplified native controls, quality/subtitle/settings
   menus all hidden.

   Fix: Set iframe width to DESKTOP_W (960px), then apply
   CSS transform scale(vw / 960) so it visually fills the
   screen. Inside the iframe, window.innerWidth = 960px →
   embedded player renders full desktop UI with all controls.

   overflow:hidden on #playerWrap clips the layout box to
   the visible viewport, so nothing bleeds outside.
───────────────────────────────────────────────────────── */
const DESKTOP_W = 960; // px — player shows full controls at this width
let   _isMobile = false;

function setIframeScale() {
  const frame = document.getElementById('stFrame');
  if (!frame) return;

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  if (vw < DESKTOP_W) {
    _isMobile = true;
    const scale     = vw / DESKTOP_W;
    const scaledH   = Math.ceil(vh / scale);

    frame.style.width           = DESKTOP_W + 'px';
    frame.style.height          = scaledH   + 'px';
    frame.style.transform       = 'scale(' + scale + ')';
    frame.style.transformOrigin = '0 0';
    frame.style.position        = 'absolute';
    frame.style.top             = '0';
    frame.style.left            = '0';

    // Show the desktop-mode badge in top bar
    const badge = document.getElementById('desktopBadge');
    if (badge) badge.classList.add('show');

  } else {
    _isMobile = false;

    // Desktop: reset to 100% × 100%
    frame.style.width           = '100%';
    frame.style.height          = '100%';
    frame.style.transform       = 'none';
    frame.style.transformOrigin = '';
    frame.style.position        = 'absolute';
    frame.style.top             = '0';
    frame.style.left            = '0';

    const badge = document.getElementById('desktopBadge');
    if (badge) badge.classList.remove('show');
  }
}

// Recalculate on resize and orientation change
window.addEventListener('resize', setIframeScale);
window.addEventListener('orientationchange', function() {
  // Short delay lets the browser finish rotating before we read dimensions
  setTimeout(setIframeScale, 350);
});

/* ─────────────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────────────── */
(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;

  const p          = new URLSearchParams(location.search);
  const movieId    = p.get('id');
  const urlSeason  = parseInt(p.get('season'))  || 1;
  const urlEpisode = parseInt(p.get('episode')) || 1;

  let movie = null;
  if (movieId) movie = await DB.getMovie(parseInt(movieId));

  if (!movie) {
    movie = {
      id:          movieId ? parseInt(movieId) : null,
      tmdb_id:     p.get('tmdb_id')  ? parseInt(p.get('tmdb_id')) : null,
      title:       p.get('title')    || 'Movie',
      type:        p.get('type')     || 'movie',
      year:        p.get('year')     || '',
      quality:     p.get('quality')  || '',
      age_rating:  p.get('age')      || 'UA',
      duration:    p.get('dur')      || '',
      embed_url:   p.get('embed')    || '',
      poster_url:  p.get('poster')   || '',
      backdrop_url:p.get('backdrop') || '',
    };
  }

  movie._season  = urlSeason;
  movie._episode = urlEpisode;
  movieData = movie;

  if (movie.id) {
    await ML.init(currentUser.id);   // loads full list; ML.has() used by updateMLBtn
    updateMLBtn();
  }
  if (movie.tmdb_id) {
    Ratings.injectStyles();
    await Ratings.init(currentUser.id);
    document.getElementById('thumbsSlot').innerHTML = Ratings.thumbsHTML(movie.tmdb_id, movie.type, 'sm');

    // Personal fulfilled-request override (see xwerse-config.js:
    // DB.getMyRequestOverride for how this stays scoped to just this user).
    const myOverride = await DB.getMyRequestOverride(currentUser.id, movie.tmdb_id, movie.type, urlSeason);
    if (myOverride) movie.embed_url = myOverride;
  }

  // Direct-stream request (opened from My Requests): ownership + payment are
  // re-checked here via RLS-protected query; the link itself is never in the URL.
  const reqParam = p.get('req');
  if (reqParam) {
    movie._reqId = reqParam;
    const direct = await DB.getMyDirectStream(currentUser.id, reqParam);
    if (direct) movie.direct_url = direct;
    else movie._directDenied = true;
  }

  loadVideo(movie);

  if (movie.id) {
    DB.addToHistory(currentUser.id, movie.id).catch(() => {});
    DB.incrementViews(movie.id).catch(() => {});
  }

  watchStart = Date.now();
  syncTimer  = setInterval(syncProgress, 30000);
})();

/* ─────────────────────────────────────────────────────────
   DIRECT STREAM — video bytes go straight from the host
   (e.g. Telegram stream bot) to the viewer's browser. Our own
   server / Vercel never touches the video, so no bandwidth cost.
───────────────────────────────────────────────────────── */
let _plyr = null;

function loadDirect(m) {
  const msg  = document.getElementById('ldMsg');
  const fail = (html) => { msg.innerHTML = html; msg.style.color = '#ff6b6b'; };

  if (!m.direct_url) {
    fail('🔒 This video is only available to the account that requested it,<br>' +
         '<span style="font-size:.72rem;color:#888">once the request is paid and completed.</span>');
    return;
  }

  document.body.classList.add('dv-mode');
  document.getElementById('dvWrap').style.display = 'block';
  const v = document.getElementById('dvVideo');

  const posKey = 'xv_pos_' + (m._reqId || m.direct_url.slice(-40));
  let startAt = 0;
  try { startAt = parseFloat(localStorage.getItem(posKey)) || 0; } catch (e) {}

  if (typeof Plyr !== 'undefined') {
    _plyr = new Plyr(v, {
      controls: ['play-large','play','progress','current-time','duration','mute','volume','settings','pip','airplay','fullscreen'],
      settings: ['speed'],
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
      fullscreen: { enabled: true, iosNative: true, container: '#playerWrap' },
      keyboard: { focused: true, global: true },
      tooltips: { controls: true, seek: true },
      clickToPlay: true,
      iconUrl: 'https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.svg', // same CDN as the script, no 2nd host
    });
  } else {
    v.controls = true; // Plyr CDN blocked → still works with native controls
  }

  let lastSaved = 0;
  v.addEventListener('loadedmetadata', () => {
    if (startAt > 5 && v.duration && startAt < v.duration - 15) v.currentTime = startAt;
  }, { once: true });
  v.addEventListener('canplay', () => {
    document.getElementById('loadScreen').style.display = 'none';
  }, { once: true });
  v.addEventListener('timeupdate', () => {
    const now = Date.now();
    if (now - lastSaved < 5000) return;
    lastSaved = now;
    try { localStorage.setItem(posKey, String(v.currentTime)); } catch (e) {}
  });
  v.addEventListener('ended', () => { try { localStorage.removeItem(posKey); } catch (e) {} });
  let failed = false;
  v.addEventListener('error', () => {
    failed = true;
    document.getElementById('loadScreen').style.display = 'flex';
    fail('⚠️ Could not load this video.<br>' +
         '<span style="font-size:.72rem;color:#888">The stream link may have expired — please contact support from the Contact page.</span>');
  });

  v.src = m.direct_url;
  // Safety net: if canplay never fires (slow host), still show the player.
  setTimeout(() => { if (!failed) document.getElementById('loadScreen').style.display = 'none'; }, 8000);
  openMenu();
}

/* ─────────────────────────────────────────────────────────
   LOAD VIDEO
───────────────────────────────────────────────────────── */
function loadVideo(m) {
  const season  = m._season  || 1;
  const episode = m._episode || 1;
  const isTV    = m.type === 'tv';

  document.getElementById('topTitle').textContent = m.title;
  document.getElementById('topSub').textContent   = isTV
    ? 'Season ' + season + ' · Episode ' + episode
    : (m.year || '');

  document.getElementById('qualBadge').textContent = m.quality || 'HD';
  document.getElementById('yearBadge').textContent = m.year || '';
  document.getElementById('ageBadge').textContent  = m.age_rating || '';
  document.getElementById('durBadge').textContent  = m.duration || '';

  document.title = isTV
    ? m.title + ' S' + season + 'E' + episode + ' — XwerseMovies'
    : m.title + ' — XwerseMovies';

  // Direct-stream request → built-in HTML5 player, no iframe at all
  if (m.direct_url || m._directDenied) { loadDirect(m); return; }

  // Embed URL priority — DIFFERS for movies vs TV shows:
  //
  // MOVIES: DB override → URL param → auto-build from TMDB
  //   (no episodes, one fixed embed_url is always correct)
  //
  // TV SHOWS: ALWAYS auto-build from tmdb_id + season + episode
  //   BUG FIX: previously dbEmbed (a single static URL, usually
  //   saved from testing S1E1 in admin panel) took priority over
  //   season/episode — so "Next Episode" changed the URL params
  //   and UI text, but the iframe kept loading the SAME fixed
  //   episode every time. A single embed_url field cannot
  //   represent more than one episode, so for TV it must never
  //   override the per-episode auto-build.
  const dbEmbed  = (m.embed_url && m.embed_url.trim()) ? m.embed_url.trim() : null;
  const urlEmbed = (m.embedUrl  && m.embedUrl.trim())  ? m.embedUrl.trim()  : null;
  let   embedUrl = null;

  if (isTV) {
    // TV: build fresh per-episode URL first; only fall back to a
    // static DB/URL embed if there's no tmdb_id to auto-build from.
    const tid = m.tmdb_id || null;
    if (tid && m.auto_embed !== false) {
      embedUrl = 'https://vidsrc.to/embed/tv/' + tid + '/' + season + '/' + episode;
    } else {
      embedUrl = dbEmbed || urlEmbed;
    }
  } else {
    // Movies: static override still makes sense (no episodes)
    embedUrl = dbEmbed || urlEmbed;
    if (!embedUrl) {
      const tid = m.tmdb_id || null;
      if (tid && m.auto_embed !== false) {
        embedUrl = 'https://vidsrc.to/embed/movie/' + tid;
      }
    }
  }

  if (m.embed_working === false && !m.manual_embed) {
    document.getElementById('ldMsg').innerHTML =
      '⚠️ This video may be unavailable.<br>' +
      '<span style="font-size:.72rem;color:#888">Set a custom embed in the admin panel.</span>';
    document.getElementById('ldMsg').style.color = '#f5c518';
    if (!embedUrl) return;
  }

  if (!embedUrl) {
    document.getElementById('ldMsg').innerHTML =
      '⚠️ Video URL not found.<br>' +
      '<span style="font-size:.72rem;color:#888">Set the embed URL in the admin panel.</span>';
    document.getElementById('ldMsg').style.color = '#ff6b6b';
    return;
  }

  const frame = document.getElementById('stFrame');
  frame.src   = embedUrl;
  frame.style.display = 'block';

  // FIX #2: Apply scale immediately after iframe is made visible
  setIframeScale();

  // Show brief mobile desktop-mode notice
  if (window.innerWidth < DESKTOP_W) {
    const notice = document.getElementById('mobileNotice');
    if (notice) {
      notice.classList.add('show');
      setTimeout(() => notice.classList.remove('show'), 3000);
    }
  }

  setTimeout(() => {
    document.getElementById('loadScreen').style.display = 'none';
    openMenu(); // Show controls once on load so user discovers the ≡ button
  }, 2500);

  // PHASE 3: Start episode timers (Skip Intro + Next Episode)
  startEpisodeTimers(m);
}

/* ─────────────────────────────────────────────────────────
   OVERLAY INTERACTION — EXPLICIT CONTROL ARCHITECTURE

   The overlay has exactly TWO triggers:
     openMenu()  ← called by the ≡ button (and on initial load)
     closeMenu() ← called by the ✕ button

   No document.addEventListener('mousemove', ...)
   No document.addEventListener('click', ...)
   No document.addEventListener('touchstart', ...)
   No tapZone layer.

   The embedded player (VidSrc) receives ALL pointer events by
   default. The overlay only interrupts the player during the
   5-second window after the user deliberately presses ≡.
   Pressing ✕ returns full control to the embedded player
   immediately and the overlay stays hidden until ≡ is pressed.
───────────────────────────────────────────────────────── */
function openMenu() {
  document.getElementById('playerWrap').classList.add('ui-on');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(closeMenu, 5000);
}

function closeMenu() {
  clearTimeout(uiTimer);
  document.getElementById('playerWrap').classList.remove('ui-on');
}

// Internal aliases — keeps the rest of the codebase unchanged
function showUI() { openMenu(); }
function hideUI()  { closeMenu(); }

// ── NO global listeners that steal events from the iframe ──

/* ─────────────────────────────────────────────────────────
   FULLSCREEN  (FIX #4)

   Cross-browser fullscreen chain:
   1. Standard Fullscreen API (Chrome, Firefox, Edge, Android)
   2. webkit prefix (older Safari, older Chrome on iOS WKWebView)
   3. Fallback: try the iframe element itself (iOS Safari)
      → frame.webkitEnterFullscreen() is the only method that
        triggers true native fullscreen on iOS Safari
───────────────────────────────────────────────────────── */
function reqFS() {
  const wrap  = document.getElementById('playerWrap');
  const frame = document.getElementById('stFrame');

  // Already in fullscreen → exit
  const inFS = document.fullscreenElement
             || document.webkitFullscreenElement
             || document.mozFullScreenElement;

  if (inFS) {
    const exit = document.exitFullscreen
               || document.webkitExitFullscreen
               || document.mozCancelFullScreen;
    if (exit) exit.call(document);
    return;
  }

  // Try wrapper div first (best experience — keeps our overlay)
  const requestFS = wrap.requestFullscreen
                  || wrap.webkitRequestFullscreen
                  || wrap.mozRequestFullScreen;

  if (requestFS) {
    requestFS.call(wrap).catch(() => {
      // Wrapper FS failed (common on iOS) → try iframe directly
      tryIframeFS(frame);
    });
  } else {
    tryIframeFS(frame);
  }
}

function tryIframeFS(frame) {
  // webkitEnterFullscreen works on iOS Safari for <video> inside iframe
  // For the iframe element itself on iOS:
  const iFS = frame.requestFullscreen
            || frame.webkitRequestFullscreen
            || frame.webkitEnterFullscreen  // iOS Safari-specific
            || frame.mozRequestFullScreen;

  if (iFS) iFS.call(frame).catch(() => {});
}

/* ─────────────────────────────────────────────────────────
   MY LIST
───────────────────────────────────────────────────────── */
async function toggleML() {
  if (!currentUser || !movieData?.id) {
    showToast('ℹ️ This title is not yet in the library');
    return;
  }
  const result = await ML.toggle(movieData);
  if (result !== null) updateMLBtn();
}

function updateMLBtn() {
  const btn    = document.getElementById('mlBtn');
  const inList = movieData?.id ? ML.has(movieData.id) : false;
  if (inList) {
    btn.textContent = '✓ In My List';
    btn.classList.add('added');
  } else {
    btn.textContent = '＋ My List';
    btn.classList.remove('added');
  }
}

/* ─────────────────────────────────────────────────────────
   SHARE
───────────────────────────────────────────────────────── */
function shareMovie() {
  if (navigator.share) {
    navigator.share({ title: movieData?.title, url: location.href });
  }
}

/* ─────────────────────────────────────────────────────────
   BACK
───────────────────────────────────────────────────────── */
async function goBack() {
  clearInterval(syncTimer);
  await syncProgress();
  if (document.referrer && document.referrer.includes('XwerseMovies')) {
    history.back();
  } else {
    location.href = 'XwerseMovies_Home.html';
  }
}

/* ─────────────────────────────────────────────────────────
   PROGRESS SYNC
───────────────────────────────────────────────────────── */
async function syncProgress() {
  if (!currentUser || !movieData?.id || !watchStart) return;

  const watched = Math.floor((Date.now() - watchStart) / 1000);
  const dur     = movieData.duration
                  ? parseInt(movieData.duration) * 60
                  : 5400;

  const extraData = movieData.type === 'tv'
    ? { season: movieData._season || 1, episode: movieData._episode || 1 }
    : {};

  await DB.upsertContinueWatching(
    currentUser.id, movieData.id, watched, dur, extraData
  );

  const dot = document.getElementById('syncDot');
  dot.classList.add('show');
  setTimeout(() => dot.classList.remove('show'), 2000);
}

/* ─────────────────────────────────────────────────────────
   KEYBOARD SHORTCUTS (desktop)
   M / m   → open overlay menu   (explicit, matches new architecture)
   F / f   → fullscreen toggle
   Escape  → go back
   No showUI() on every keypress — that violated the explicit-only rule.
───────────────────────────────────────────────────────── */

/* ═════════════════════════════════════════════════════════
   PHASE 3 — SKIP INTRO + NEXT EPISODE
   ═════════════════════════════════════════════════════════

   Skip Intro:
   • Appears 20s after video loads (TV only)
   • Disappears at 80s automatically
   • Click → just dismisses (VidSrc iframe can't be seeked)
   • VidSrc's OWN skip intro button still works inside player

   Next Episode:
   • Appears at 85% of episode duration (default 42 min)
   • 10-second countdown then auto-navigates to next episode
   • User can dismiss or click Play immediately
   ═════════════════════════════════════════════════════════ */

/* ═════════════════════════════════════════════════════════
   NEXT EPISODE  (TV shows only)
   ═════════════════════════════════════════════════════════
   Honest constraint: VidSrc/Dailymotion iframes are cross-origin.
   We cannot read currentTime, detect play/pause, or know when
   the video actually ends. So "Skip Intro" was removed entirely —
   it did nothing except hide a button, which is misleading UI.

   What IS reliable and kept:
   1. Manual "Next Episode" button in the top bar — always visible
      for TV shows, works instantly via URL navigation. 100% real.
   2. "Up Next" suggestion panel — a best-effort ESTIMATE based on
      admin-set duration (default 42 min), shown at ~85% of that
      estimate. Clearly optional — user can dismiss or ignore it,
      and the reliable manual button is always available too.
   ═════════════════════════════════════════════════════════ */

let _nepT = null;   // "Up Next" suggestion show timer
let _nepI = null;   // countdown interval
let _nepN = 10;      // countdown value

function startEpisodeTimers(m) {
  clearTimeout(_nepT); clearInterval(_nepI);
  const np = document.getElementById('nextEpPanel');
  if (np) np.classList.remove('show');

  const nextBtn = document.getElementById('nextEpBtn');
  if (nextBtn) nextBtn.style.display = (m.type === 'tv') ? 'flex' : 'none';

  if (m.type !== 'tv') return; // Movies: no next-episode features

  const season  = m._season  || 1;
  const episode = m._episode || 1;

  // Best-effort "Up Next" suggestion at ~85% of estimated duration
  const epMins   = Math.max(30, movieData?.duration ? parseInt(movieData.duration) : 42);
  const showAtMs = epMins * 60 * 1000 * 0.85;

  _nepT = setTimeout(() => {
    showNextEpPanel(season, episode + 1);
  }, showAtMs);
}

function showNextEpPanel(season, nextEp) {
  const panel = document.getElementById('nextEpPanel');
  const title = document.getElementById('nepTitle');
  const sub   = document.getElementById('nepSub');
  const cd    = document.getElementById('nepCd');
  if (!panel) return;

  title.textContent = 'S' + season + ' E' + nextEp;
  sub.textContent   = movieData?.title || '';
  _nepN = 10;
  cd.textContent = '10';
  panel.classList.add('show');

  clearInterval(_nepI);
  _nepI = setInterval(() => {
    _nepN--;
    cd.textContent = _nepN;
    if (_nepN <= 0) {
      clearInterval(_nepI);
      doPlayNextEp();
    }
  }, 1000);
}

function doDismissNextEp() {
  clearInterval(_nepI);
  clearTimeout(_nepT);
  const p = document.getElementById('nextEpPanel');
  if (p) p.classList.remove('show');
}

// Reliable manual trigger — always works, no timer dependency.
// Called by: the "Up Next" panel's Play button, OR the persistent
// Next Episode button in the top bar.
function doPlayNextEp() {
  doDismissNextEp();
  if (!movieData) return;
  const nextEp = (movieData._episode || 1) + 1;
  const season = movieData._season  || 1;
  const params = new URLSearchParams(location.search);
  params.set('episode', nextEp);
  params.set('season',  season);
  params.delete('embed'); // Force auto-build embed for new episode
  location.href = 'XwerseMovies_Player.html?' + params.toString();
}


document.addEventListener('keydown', e => {
  if (e.key === 'Escape')            goBack();
  if (e.key === 'f' || e.key === 'F') reqFS();
  if (e.key === 'm' || e.key === 'M') openMenu();
});

/* ─────────────────────────────────────────────────────────
   CLEANUP
───────────────────────────────────────────────────────── */
window.addEventListener('beforeunload', () => {
  clearInterval(syncTimer);
  clearTimeout(_skiT1); clearTimeout(_skiT2);
  clearTimeout(_nepT); clearInterval(_nepI);
});

</script>
