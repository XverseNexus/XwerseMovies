<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red: #E50914; --red-dark: #B00710; --green: #46d369;
  --bg: #141414; --bg2: #0a0a0a; --card: #1c1c1c; --card2: #242424;
  --text: #e5e5e5; --muted: #808080; --border: rgba(255,255,255,.08);
  --content-max: 1900px;
  --content-pad: max(4%, calc((100% - var(--content-max)) / 2));
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:66px;display:flex;align-items:center;padding:0 var(--content-pad);gap:24px;background:rgba(8,8,8,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--red);letter-spacing:2px;text-decoration:none;flex-shrink:0}
.logo span{color:#fff}
.nav-links{display:flex;gap:2px;list-style:none}
.nav-link{color:rgba(255,255,255,.7);text-decoration:none;font-size:.86rem;font-weight:500;padding:6px 12px;border-radius:4px;transition:all .2s;cursor:pointer;border:none;background:none;font-family:'Barlow',sans-serif}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-link.active{color:#fff;font-weight:700}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-avatar{width:30px;height:30px;border-radius:4px;background:linear-gradient(135deg,var(--red),#831010);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;cursor:pointer;color:#fff;overflow:hidden;border:2px solid transparent;transition:border-color .2s}
.nav-avatar:hover{border-color:rgba(255,255,255,.5)}
.nav-avatar img{width:100%;height:100%;object-fit:cover}
.nav-bell{background:none;border:none;color:rgba(255,255,255,.72);cursor:pointer;width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.95rem;transition:all .2s;position:relative;flex-shrink:0}
.nav-bell:hover{background:rgba(255,255,255,.09);color:#fff}
main{padding:88px var(--content-pad) 60px;max-width:960px;margin:0 auto}
.page-hd{margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-title{font-family:'Bebas Neue',cursive;font-size:clamp(1.8rem,4vw,2.6rem);color:#fff;letter-spacing:2px}
.page-sub{font-size:.84rem;color:var(--muted);margin-top:4px}
.btn-new-req{background:var(--red);color:#fff;border:none;padding:10px 20px;font-size:.86rem;font-weight:700;border-radius:6px;cursor:pointer;font-family:'Barlow',sans-serif;transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-new-req:hover{background:#f40612}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.fbtn{background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.68);padding:6px 16px;border-radius:20px;font-size:.78rem;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;white-space:nowrap}
.fbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.fbtn.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.empty{text-align:center;padding:70px 20px}
.empty-ico{font-size:3.5rem;margin-bottom:16px;opacity:.28}
.empty-title{font-size:1.1rem;font-weight:600;color:rgba(255,255,255,.4);margin-bottom:8px}
.empty-sub{font-size:.84rem;color:var(--muted);line-height:1.6;margin-bottom:24px}
.btn-browse{background:var(--red);color:#fff;border:none;padding:11px 28px;font-size:.88rem;font-weight:700;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;transition:background .2s;text-decoration:none;display:inline-block}
.btn-browse:hover{background:#f40612}
.skel{background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200%}100%{background-position:-200%}}
.req-list{display:flex;flex-direction:column;gap:12px}
.req-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;gap:14px;transition:border-color .2s}
.req-card:hover{border-color:rgba(255,255,255,.18)}
.req-poster{width:60px;height:88px;object-fit:cover;border-radius:6px;background:#2a2a2a;flex-shrink:0}
.req-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.req-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.req-title{font-size:1rem;font-weight:700;color:#fff}
.req-meta{font-size:.76rem;color:var(--muted)}
.req-date{font-size:.68rem;color:rgba(255,255,255,.35);margin-top:2px}
.req-badge{font-size:.68rem;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap;border:1px solid;flex-shrink:0}
.req-note{font-size:.76rem;color:rgba(255,255,255,.55);margin-top:6px;line-height:1.5;background:rgba(255,255,255,.04);border-radius:6px;padding:8px 10px}
.req-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.req-btn{background:var(--red);color:#fff;border:none;padding:8px 16px;font-size:.78rem;font-weight:700;border-radius:5px;cursor:pointer;font-family:'Barlow',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:background .2s}
.req-btn:hover{background:#f40612}
.req-btn.secondary{background:rgba(255,255,255,.09);color:#fff}
.req-btn.secondary:hover{background:rgba(255,255,255,.16)}
@media(max-width:640px){
  .nav-links{display:none}
  main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))!important}

  .mnav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 2px 8px;text-decoration:none;color:rgba(255,255,255,.42);font-family:'Barlow',sans-serif;transition:color .18s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;box-sizing:border-box}
  .mnav-item.active{color:#fff}
  .mnav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:#E50914;border-radius:0 0 3px 3px}
  .mnav-ico{width:22px;height:22px;fill:currentColor;flex-shrink:0}
  .mnav-avatar{width:22px;height:22px;border-radius:4px;background:linear-gradient(135deg,var(--red,#E50914),#831010);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.6rem;color:#fff;overflow:hidden;flex-shrink:0}
  .mnav-lbl{font-size:.56rem;font-weight:600;letter-spacing:.1px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
}
</style>

<script>
// ─────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────
let currentUser = null;
let reqData     = [];
let reqFilter   = 'all';

// Colors for the "awaiting payment" states — REQUEST_STATUS in
// xwerse-config.js only covers post-payment workflow statuses, these two
// are payment_status-derived and shown instead of the workflow status
// until payment_status becomes 'paid'.
const PAYMENT_BADGE = {
  pending: { label: '⏳ Payment Pending', color: '#f5c518' },
  failed:  { label: '❌ Payment Failed',  color: '#E50914' },
};

function virtualStatus(r) {
  if (r.payment_status !== 'paid') {
    return r.payment_status === 'failed' ? 'payment_failed' : 'awaiting_payment';
  }
  if (r.status === 'completed') return 'completed';
  if (r.status === 'rejected') return 'rejected';
  return 'in_progress'; // pending / accepted / processing / uploading
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function reqCardHTML(r) {
  const vs = virtualStatus(r);
  let badge;
  if (vs === 'awaiting_payment') badge = PAYMENT_BADGE.pending;
  else if (vs === 'payment_failed') badge = PAYMENT_BADGE.failed;
  else badge = Xwerse.REQUEST_STATUS[r.status] || { label: r.status, color: '#808080' };

  const typeLabel = r.request_type === 'season'
    ? `Season ${r.season_number || ''}`.trim()
    : (Xwerse.REQUEST_PRICES[r.request_type]?.label || r.request_type);

  const date = new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

  let note = '';
  if (vs === 'awaiting_payment') {
    note = `<div class="req-note">⏳ Waiting for payment confirmation. If you've already paid, this can take a few minutes to update — no need to pay again.</div>`;
  } else if (vs === 'payment_failed') {
    note = `<div class="req-note">❌ This payment didn't go through. No amount was charged. You can submit a fresh request whenever you're ready.</div>`;
  } else if (r.status !== 'completed' && r.admin_notes) {
    note = `<div class="req-note">${escHtml(r.admin_notes)}</div>`;
  }

  let actions = '';
  if (r.status === 'completed' && r.payment_status === 'paid') {
    const playParams = new URLSearchParams();
    if (r.tmdb_id) playParams.set('tmdb_id', r.tmdb_id);
    playParams.set('title', r.title);
    playParams.set('type', r.request_type === 'movie' ? 'movie' : 'tv');
    if (r.season_number) playParams.set('season', r.season_number);
    if (r.poster_url) playParams.set('poster', r.poster_url);

    // Direct-stream requests open the built-in player by request id; the
    // Player re-checks ownership + payment itself, nothing sensitive is in the URL.
    if (r.direct_url) playParams.set('req', r.id);

    actions = `<div class="req-actions">`;
    if (r.direct_url || r.watch_url) {
      actions += `<a class="req-btn" href="XwerseMovies_Player.html?${playParams.toString()}">▶ Watch Now</a>`;
    }
    if (r.download_url) {
      actions += `<a class="req-btn secondary" href="${escHtml(r.download_url)}" target="_blank" rel="noopener">⬇ Download</a>`;
    }
    actions += `</div>`;
  }

  return `
    <div class="req-card">
      <img class="req-poster" src="${escHtml(r.poster_url || '')}" onerror="this.style.visibility='hidden'">
      <div class="req-body">
        <div class="req-top">
          <div>
            <div class="req-title">${escHtml(r.title)}</div>
            <div class="req-meta">${escHtml(typeLabel)} · ₹${r.price}</div>
            <div class="req-date">Requested ${date}</div>
          </div>
          <span class="req-badge" style="background:${badge.color}22;border-color:${badge.color}55;color:${badge.color}">${badge.label}</span>
        </div>
        ${note}
        ${actions}
      </div>
    </div>`;
}

function renderReqList() {
  const filtered = reqFilter === 'all'
    ? reqData
    : reqData.filter(r => virtualStatus(r) === reqFilter || (reqFilter === 'awaiting_payment' && virtualStatus(r) === 'payment_failed'));

  const listEl  = document.getElementById('reqList');
  const emptyEl = document.getElementById('reqEmpty');

  if (!filtered.length) {
    listEl.style.display = 'none';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';
  listEl.style.display = 'flex';
  listEl.innerHTML = filtered.map(reqCardHTML).join('');
}

function filterReq(f, btn) {
  reqFilter = f;
  document.querySelectorAll('#reqFilterBar .fbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderReqList();
}

async function loadMyRequests() {
  reqData = await DB.getUserRequests(currentUser.id);

  document.getElementById('reqSkeleton').style.display = 'none';
  document.getElementById('reqCountText').textContent =
    reqData.length ? `${reqData.length} request${reqData.length === 1 ? '' : 's'}` : 'No requests yet';

  if (!reqData.length) {
    document.getElementById('reqEmpty').style.display = 'block';
    return;
  }
  renderReqList();
}

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;
  await initNavAvatar('navAvatar');
  await initNavAvatar('mnavProfileAvatar');
  if (typeof XvNotif !== 'undefined') XvNotif.init(currentUser.id);
  await loadMyRequests();
})();
</script>
