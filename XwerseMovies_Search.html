<style>
:root{
      /* Brand */
      --red: #E50914;
      --red-dark: #B00710;
      --green: #46d369;
      /* Backgrounds */
      --bg: #141414;
      --bg2: #0a0a0a;
      --card: #1c1c1c;
      --card2: #242424;
      /* Text / Border */
      --text: #e5e5e5;
      --muted: #808080;
      --border: rgba(255,255,255,.08);
      /* Spacing scale */
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px;
      --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
      /* Radius scale */
      --r-sm: 4px; --r-md: 6px; --r-lg: 10px; --r-full: 50%;
      /* Shadows */
      --shadow-card: 0 8px 32px rgba(0,0,0,.7);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.4);
      /* Breakpoint scale (Task 6) — reference values used consistently across
         @media queries site-wide. CSS vars can't be used inside @media
         conditions, so this is the documented source of truth: use these
         literal px values in @media rules instead of ad-hoc numbers.
           --bp-xs   480px  → small phones
           --bp-sm   640px  → phones / mobile nav switch
           --bp-md  1024px  → tablets (portrait/landscape)
           --bp-lg  1440px  → laptops / small desktops
           --bp-xl  1920px  → large desktop
         */
      /* Site-wide content gutter — caps main content width on ultra-wide
         monitors (~1900px, like Netflix) instead of stretching edge-to-edge.
         Below that width it behaves exactly like the old flat 4% padding. */
      --content-max: 1900px;
      --content-pad: max(4%, calc((100% - var(--content-max)) / 2));
    }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}

/* ── NAV ─────────────────────────────────────────────── */
#mainNav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;gap:20px;
  padding:0 var(--content-pad);height:64px;
  background:linear-gradient(to bottom,rgba(0,0,0,.9) 0%,transparent 100%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .3s;
}
#mainNav.scrolled{background:rgba(14,14,14,.98)}
.logo{font-family:'Bebas Neue',cursive;font-size:1.7rem;letter-spacing:2px;color:#fff;text-decoration:none}
.logo span{color:var(--red)}
.nav-links{list-style:none;display:flex;gap:4px}
.nav-link{background:none;border:none;color:rgba(255,255,255,.65);cursor:pointer;padding:6px 10px;border-radius:4px;font-family:'Barlow',sans-serif;font-size:.82rem;font-weight:500;transition:.2s}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav-link.active{color:#fff}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-icon-btn{background:none;border:none;color:rgba(255,255,255,.78);cursor:pointer;width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:.95rem;position:relative}
.nav-icon-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-avatar{width:30px;height:30px;border-radius:4px;background:linear-gradient(135deg,var(--red),#831010);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;cursor:pointer;color:#fff;overflow:hidden;border:2px solid transparent;transition:border-color .2s;flex-shrink:0}
.nav-avatar:hover{border-color:rgba(255,255,255,.5)}
.nav-avatar img{width:100%;height:100%;object-fit:cover}
@media(max-width:640px){.nav-links{display:none}
  .mbg{padding:0;align-items:flex-end;background:rgba(0,0,0,.4)}
  .mc{width:100%;max-width:none;height:100%;max-height:100%;border-radius:0;animation:msuFull .28s cubic-bezier(.32,.72,0,1)}
  .mod-bd-wrap{aspect-ratio:auto;height:42vh}
  .modal-drag-handle{display:flex;align-items:center;justify-content:center;height:26px;cursor:grab;touch-action:none}
  .modal-drag-handle::after{content:'';width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
}
@keyframes msuFull{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ── SEARCH BAR ──────────────────────────────────────── */
#searchSection{
  padding:90px var(--content-pad) 0;
  position:sticky;top:64px;z-index:100;
  background:var(--bg);
  padding-bottom:0;
}
.search-wrap{
  position:relative;max-width:680px;margin:0 auto;
}
.search-icon-left{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:1.15rem;color:rgba(255,255,255,.45);pointer-events:none;
}
#searchInput{
  width:100%;height:52px;
  background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:0 48px 0 46px;
  color:#fff;font-family:'Barlow',sans-serif;font-size:1rem;font-weight:500;
  outline:none;transition:.25s;
}
#searchInput::placeholder{color:rgba(255,255,255,.35)}
#searchInput:focus{
  border-color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.12);
  box-shadow:0 0 0 3px rgba(229,9,20,.15);
}
.search-clear{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.6);
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  font-size:.75rem;display:none;align-items:center;justify-content:center;
  transition:.2s;
}
.search-clear:hover{background:rgba(255,255,255,.2);color:#fff}
.search-clear.show{display:flex}

/* ── FILTER TABS ─────────────────────────────────────── */
#filterTabs{
  max-width:680px;margin:14px auto 0;
  display:flex;gap:8px;flex-wrap:wrap;
  padding-bottom:12px;
}
.ftab{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.65);padding:6px 16px;border-radius:20px;
  cursor:pointer;font-family:'Barlow',sans-serif;font-size:.78rem;font-weight:600;
  transition:.2s;white-space:nowrap;
}

/* ── MAIN CONTENT ────────────────────────────────────── */
#mainContent{padding:20px var(--content-pad) calc(72px + env(safe-area-inset-bottom,0px))}

/* ── TRENDING (shown before search) ─────────────────── */
#trendingSection{display:block}
.section-title{
  font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:1.5px;
  color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:10px;
}
.section-badge{
  font-family:'Barlow',sans-serif;font-size:.62rem;font-weight:800;
  background:var(--red);color:#fff;padding:2px 8px;border-radius:3px;
  letter-spacing:.5px;
}

/* ── CATEGORIES GRID (shown before search) ─────────── */
.cat-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;margin-bottom:36px;
}
.cat-card{
  height:72px;border-radius:8px;display:flex;align-items:flex-end;
  padding:10px 12px;cursor:pointer;transition:.2s;overflow:hidden;
  position:relative;font-family:'Barlow',sans-serif;font-weight:700;
  font-size:.88rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.06);
}
.cat-card:hover{transform:scale(1.03);filter:brightness(1.1)}
.cat-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.35),rgba(0,0,0,.1))}
.cat-card span{position:relative;z-index:1}

/* ── RESULTS GRID ────────────────────────────────────── */
#resultsSection{display:none}
#resultsGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:10px;
}
/* ── TRENDING GRID (moved from inline style so the tablet
   media query below can actually override it — inline style
   attributes beat external CSS specificity otherwise) ── */
.trending-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:36px}

@media(max-width:480px){
  #resultsGrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
}
@media(max-width:1024px) and (min-width:641px){
  /* Tablet (Task 7) */
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  #resultsGrid,.trending-grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
}
@media(min-width:1440px){
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
  #resultsGrid,.trending-grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
}
@media(min-width:1920px){
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(194px,1fr))}
  #resultsGrid,.trending-grid{grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
}

/* ── CARD ────────────────────────────────────────────── */
.card{
  border-radius:5px;overflow:hidden;background:var(--card);
  border:1px solid var(--border);cursor:pointer;
  transition:transform .22s,border-color .22s,box-shadow .22s;
  position:relative;
}
.card:hover{transform:scale(1.06);border-color:rgba(255,255,255,.28);box-shadow:0 8px 32px rgba(0,0,0,.7);z-index:4}
.cth{position:relative;aspect-ratio:2/3;overflow:hidden;background:#1a1a1a}
.ci{width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.ctyp{
  position:absolute;top:8px;left:8px;font-size:.56rem;font-weight:800;
  padding:2px 6px;border-radius:3px;letter-spacing:.4px;
  background:rgba(0,0,0,.65);backdrop-filter:blur(4px);color:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.15);
}
.crat{
  position:absolute;top:8px;right:8px;font-size:.6rem;font-weight:700;
  background:rgba(0,0,0,.7);color:var(--green);padding:2px 6px;border-radius:3px;
}
.cov{
  position:absolute;inset:0;background:rgba(0,0,0,0);
  display:flex;align-items:center;justify-content:center;gap:8px;
  opacity:0;transition:.2s;
}
.card:hover .cov{background:rgba(0,0,0,.45);opacity:1}
.cpl,.cad{
  width:36px;height:36px;border-radius:50%;border:2px solid #fff;
  background:rgba(0,0,0,.5);color:#fff;cursor:pointer;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;transition:.18s;
  backdrop-filter:blur(4px);
}
.cpl:hover{background:#fff;color:#000}
.cad:hover{background:rgba(255,255,255,.2)}
.cif{padding:8px 10px 10px}
.cn{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:.7rem;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center}

/* ── NO RESULTS ──────────────────────────────────────── */
#noResults{
  display:none;text-align:center;padding:60px 20px;
}
.nr-ico{font-size:3rem;opacity:.2;margin-bottom:16px}
.nr-title{font-family:'Bebas Neue',cursive;font-size:1.6rem;letter-spacing:1.5px;margin-bottom:8px;color:rgba(255,255,255,.6)}
.nr-sub{color:var(--muted);font-size:.85rem;line-height:1.6;max-width:340px;margin:0 auto 20px}
.nr-btn{background:var(--red);border:none;color:#fff;padding:10px 24px;border-radius:6px;cursor:pointer;font-family:'Barlow',sans-serif;font-size:.85rem;font-weight:700;transition:.2s}
.nr-btn:hover{background:#c1070f}

/* ── SEARCHING INDICATOR ─────────────────────────────── */
#searchingIndicator{
  display:none;text-align:center;padding:40px 20px;
  color:rgba(255,255,255,.35);font-size:.85rem;
}
.spin{
  width:28px;height:28px;border:2px solid rgba(229,9,20,.3);
  border-top-color:var(--red);border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;margin-bottom:12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SKELETON ────────────────────────────────────────── */
.sk{aspect-ratio:2/3}
.sk-inner{
  width:100%;height:100%;
  background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%);
  background-size:200% 100%;
  animation:ska 1.4s ease infinite;
}
@keyframes ska{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── RESULT COUNT BAR ────────────────────────────────── */
#resultMeta{
  font-size:.78rem;color:rgba(255,255,255,.4);margin-bottom:14px;
  display:none;
}
#resultMeta b{color:rgba(255,255,255,.7)}

/* ── MODAL ───────────────────────────────────────────── */
.mbg{
  position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;
  display:none;align-items:center;justify-content:center;
  padding:16px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.mbg.open{display:flex;animation:mfi .22s ease}
@keyframes mfi{from{opacity:0}to{opacity:1}}
.mc{
  background:#181818;border-radius:10px;width:min(96vw,780px);

.mod-bd-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#0a0a0a}
.modal-drag-handle{display:none}
.mod-bd-wrap img{width:100%;height:100%;object-fit:cover}
.mod-bd-wrap::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:60%;

}
.mod-x:hover{background:rgba(255,255,255,.15)}
.mod-body{padding:0 24px 24px}

.mmt{color:var(--green);font-weight:700;font-size:.85rem}

<script>
'use strict';

// ── STATE ────────────────────────────────────────────────────
let currentUser = null;
let _filter     = 'all';
let _query      = '';
let _debounce   = null;
let _allResults = [];
let _curMovie   = null;

// Movie registry – no JSON in onclick
const _MR = new Map(); let _seq = 0;
function _reg(m){ var k=m.id?('d'+m.id):m.tmdb_id?('t'+m.tmdb_id):('s'+(++_seq)); _MR.set(k,m); return k; }
function _get(k){ return _MR.get(k)||null; }

// ── CATEGORIES ───────────────────────────────────────────────
const CATS = [
  {label:'Action',   bg:'#7b1f1f', emoji:'💥'},
  {label:'Drama',    bg:'#1f3a7b', emoji:'🎭'},
  {label:'Comedy',   bg:'#1f7b3a', emoji:'😂'},
  {label:'Horror',   bg:'#2d1a4a', emoji:'👻'},
  {label:'Sci-Fi',   bg:'#1a3a4a', emoji:'🚀'},
  {label:'Thriller', bg:'#4a3a1a', emoji:'🔪'},
  {label:'Romance',  bg:'#7b1f5a', emoji:'❤️'},
  {label:'Animation',bg:'#1a5a4a', emoji:'🎨'},
  {label:'Crime',    bg:'#3a2a1a', emoji:'🔍'},
  {label:'Fantasy',  bg:'#2a1a7b', emoji:'🧙'},
  {label:'Hindi',    bg:'#7b4a1a', emoji:'🇮🇳'},
  {label:'Korean',   bg:'#1a4a7b', emoji:'🇰🇷'},
];

// ── INIT ─────────────────────────────────────────────────────
(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;

  await initNavAvatar('navAvatar');
  await initNavAvatar('mnavProfileAvatar');   // mobile bottom-nav Profile tab (Task: real-Netflix mobile nav)
  if (typeof XvNotif !== 'undefined') XvNotif.init(currentUser.id);
  await ML.init(currentUser.id);
  Ratings.injectStyles();
  await Ratings.init(currentUser.id);

  buildCats();
  loadTrending();

  // Auto-focus search and handle input
  const inp = document.getElementById('searchInput');
  inp.focus();
  inp.addEventListener('input', onInput);
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { clearSearch(); inp.blur(); }
  });

  // Scroll nav shadow
  window.addEventListener('scroll', function(){
    document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 20);
  }, {passive:true});

  // Check if there's a query in the URL
  var q = new URLSearchParams(location.search).get('q');
  if (q) { inp.value = q; onInput(); }
})();

// ── BUILD CATEGORIES ─────────────────────────────────────────
function buildCats() {
  var grid = document.getElementById('catGrid');
  var h = '';
  for (var i = 0; i < CATS.length; i++) {
    var c = CATS[i];
    h += '<div class="cat-card" style="background:'+c.bg+'" onclick="searchCat(\''+c.label+'\')">'
       + '<span>'+c.emoji+' '+c.label+'</span></div>';
  }
  grid.innerHTML = h;
}

function searchCat(label) {
  var inp = document.getElementById('searchInput');
  inp.value = label;
  onInput();
  inp.focus();
}

// ── LOAD TRENDING ─────────────────────────────────────────────
async function loadTrending() {
  var grid = document.getElementById('trendingGrid');
  grid.innerHTML = skelG(12);
  try {
    var [dbMovies, tmdb] = await Promise.all([
      DB.getAllMovies().catch(function(){ return []; }),
      TMDB.trending().catch(function(){ return {results:[]}; })
    ]);
    var norm = (tmdb.results || []).slice(0,12).map(TMDB.normalize.bind(TMDB));
    // Merge: if TMDB item matches DB item, use DB version (has real id for ML)
    var merged = norm.map(function(t){
      return dbMovies.find(function(d){ return d.tmdb_id === t.tmdb_id; }) || t;
    });
    if (dbMovies.length) {
      // Prepend admin-added movies so they show first
      var adminFirst = dbMovies.slice(0,6);
      merged = adminFirst.concat(merged.filter(function(m){
        return !adminFirst.find(function(a){ return a.id === m.id; });
      })).slice(0,20);
    }
    grid.innerHTML = merged.map(function(m){ return cardHTML(m); }).join('');
  } catch(e) {
    grid.innerHTML = '<div style="color:rgba(255,255,255,.4);font-size:.8rem;padding:20px">Could not load trending.</div>';
  }
}

// ── SEARCH ───────────────────────────────────────────────────
function onInput() {
  var q = document.getElementById('searchInput').value.trim();
  document.getElementById('clearBtn').classList.toggle('show', q.length > 0);

  if (!q) { showTrending(); return; }

  _query = q;
  clearTimeout(_debounce);
  _debounce = setTimeout(function(){ doSearch(q); }, 350);
}

function setFilter(f, btn) {
  _filter = f;
  document.querySelectorAll('.ftab').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  if (_query) doSearch(_query);
}

async function doSearch(q) {
  showSearching();
  try {
    // Run DB search and TMDB search in parallel
    var [dbRes, tmdbRes] = await Promise.all([
      DB.searchMovies(q).catch(function(){ return []; }),
      TMDB.search(q).catch(function(){ return {results:[]}; })
    ]);

    // Normalize TMDB results
    var tmdbNorm = (tmdbRes.results || [])
      .filter(function(r){ return r.media_type === 'movie' || r.media_type === 'tv'; })
      .slice(0, 20)
      .map(function(r){ return TMDB.normalize(r); });

    // Merge: prefer DB version when tmdb_id matches
    var dbIds = new Set((dbRes || []).map(function(m){ return String(m.tmdb_id); }));
    var tmdbOnly = tmdbNorm.filter(function(t){ return !dbIds.has(String(t.tmdb_id)); });
    var combined = (dbRes || []).concat(tmdbOnly);

    _allResults = combined;
    renderResults();
  } catch(e) {
    showNoResults(q);
  }
}

function renderResults() {
  var q = _query;
  var filtered = _allResults.filter(function(m){
    if (_filter === 'movie') return m.type !== 'tv';
    if (_filter === 'tv')    return m.type === 'tv';
    return true;
  });

  if (!filtered.length) { showNoResults(q); return; }

  document.getElementById('trendingSection').style.display   = 'none';
  document.getElementById('searchingIndicator').style.display= 'none';
  document.getElementById('noResults').style.display         = 'none';
  document.getElementById('resultsSection').style.display    = 'block';

  var meta = document.getElementById('resultMeta');
  meta.style.display = 'block';
  meta.innerHTML = '<b>'+filtered.length+'</b> results for "<b>'+escHtml(q)+'</b>"';

  document.getElementById('resultsGrid').innerHTML = filtered.map(function(m){ return cardHTML(m); }).join('');
}

function showTrending() {
  _query = '';
  _allResults = [];
  document.getElementById('trendingSection').style.display   = 'block';
  document.getElementById('searchingIndicator').style.display= 'none';
  document.getElementById('resultsSection').style.display    = 'none';
  document.getElementById('noResults').style.display         = 'none';
}

function showSearching() {
  document.getElementById('trendingSection').style.display   = 'none';
  document.getElementById('searchingIndicator').style.display= 'block';
  document.getElementById('resultsSection').style.display    = 'none';
  document.getElementById('noResults').style.display         = 'none';
}

function showNoResults(q) {
  document.getElementById('trendingSection').style.display   = 'none';
  document.getElementById('searchingIndicator').style.display= 'none';
  document.getElementById('resultsSection').style.display    = 'none';
  var nr = document.getElementById('noResults');
  nr.style.display = 'block';
  document.getElementById('noResultsSub').textContent =
    'No results for "' + q + '". Try a different spelling or browse categories.';
}

function clearSearch() {
  var inp = document.getElementById('searchInput');
  inp.value = '';
  document.getElementById('clearBtn').classList.remove('show');
  _query = ''; _allResults = [];
  showTrending();
}

// ── CARD HTML ─────────────────────────────────────────────────
function cardHTML(m) {
  var k   = _reg(m);
  var rat = m.rating || m.vote_average || '';
  var isTV  = m.type === 'tv', tvF = isTV ? '1' : '0';
  var inML  = ML.has(m.id), mlLbl = inML ? '&#10003;' : '+';
  var img   = m.poster_url || '';
  var title = m.title || '';
  var year  = m.year  || '';
  var typ   = m.type  || 'movie';
  var ratH  = rat ? '<span class="crat">&#9733; '+rat+'</span>' : '';
  return '<div class="card" data-mk="'+k+'" onclick="openMod(_get(this.dataset.mk))">'
    +'<div class="cth">'
    +(img ? '<img class="ci" src="'+img+'" alt="'+escHtml(title)+'" loading="lazy">'
           : '<div style="width:100%;height:100%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.15);font-size:2rem">🎬</div>')
    +'<span class="ctyp">'+(isTV?'TV':'MOVIE')+'</span>'+ratH
    +'<div class="cov">'
    +'<button class="cpl" data-mk="'+k+'" data-tv="'+tvF+'" onclick="event.stopPropagation();_pc(this)">&#9654;</button>'
    +'<button class="cad" data-mk="'+k+'" onclick="event.stopPropagation();_ac(this)">'+mlLbl+'</button>'
    +'</div></div>'
    +'<div class="cif"><div class="cn">'+escHtml(title)+'</div>'
    +'<div class="cm"><span>'+escHtml(year)+'</span>'+(rat?'<span style="color:var(--green)">&#9733; '+rat+'</span>':'')+'</div></div>'
    +'</div>';
}

function skelG(n) {
  var h = '';
  for (var i = 0; i < n; i++) {
    h += '<div class="card sk"><div class="sk-inner"></div></div>';
  }
  return h;
}

// ── PLAY / ADD HELPERS ───────────────────────────────────────
function _pc(el) {
  var m = _get(el.dataset.mk); if (!m) return;
  if (el.dataset.tv === '1') openMod(m); else play(m);
}
function _ac(el) {
  var m = _get(el.dataset.mk); if (m) addML(m);
}

function play(m) {
  if (!m) return;
  if (m.type === 'tv') { openMod(m); return; }
  var p = new URLSearchParams();
  if (m.id)        p.set('id',        m.id);
  if (m.tmdb_id)   p.set('tmdb_id',   m.tmdb_id);
  p.set('type',    m.type||'movie'); p.set('title',   m.title||'');
  p.set('year',    m.year||'');      p.set('poster',  m.poster_url||'');
  p.set('backdrop',m.backdrop_url||''); p.set('age', m.age_rating||'');
  p.set('quality', m.quality||'');
  if (m.embed_url) p.set('embed', m.embed_url);
  location.href = 'XwerseMovies_Player.html?' + p.toString();
}

async function addML(m) {
  if (!m) return;
  var r = await ML.toggle(m);
  if (r === null) return;
  document.querySelectorAll('[data-mk="'+_reg(m)+'"]').forEach(function(el){
    if (el.classList.contains('cad')) el.innerHTML = r ? '&#10003;' : '+';
  });
}

// ── MODAL ────────────────────────────────────────────────────
function openMod(m) {
  if (!m) return;
  _curMovie = m;
  document.body.style.overflow = 'hidden';
  var isTV  = m.type === 'tv', k = _reg(m), tvF = isTV ? '1' : '0';
  var match = Math.round(65 + parseFloat(m.rating||m.vote_average||7) * 3.5);
  var inML  = ML.has(m.id);

  document.getElementById('modImg').src = m.backdrop_url || m.poster_url || '';
  document.getElementById('modTitle').textContent = m.title || '';
  document.getElementById('modMeta').innerHTML =
    '<span class="mmt">'+match+'% Match</span>'
    +(m.year ? '<span>'+m.year+'</span>' : '')
    +(m.age_rating ? '<span class="mce">'+m.age_rating+'</span>' : '')
    +'<span>'+(isTV ? 'TV Show' : 'Movie')+'</span>'
    +(m.quality ? '<span style="background:rgba(70,211,105,.12);color:var(--green);font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:3px">'+m.quality+'</span>' : '');
  document.getElementById('modOv').textContent = m.overview || '';

  var pb = document.getElementById('mPlayBtn');
  pb.dataset.mk = k; pb.dataset.tv = tvF;
  pb.textContent = isTV ? '▶ Play S1 E1' : '▶ Play';
  pb.onclick = function(){ if (_curMovie.type==='tv') bPlayEp(1,1); else play(_curMovie); };

  var ab = document.getElementById('mAddBtn');
  var thumbsEl = document.getElementById('mThumbsSlot');
  if (thumbsEl) thumbsEl.innerHTML = m.tmdb_id ? Ratings.thumbsHTML(m.tmdb_id, m.type) : '';
  ab.innerHTML = inML ? '✓ In My List' : '+ My List';
  ab.onclick = async function(){
    var r = await ML.toggle(_curMovie); if (r===null) return;
    this.innerHTML = r ? '✓ In My List' : '+ My List';
  };

  var epW = document.getElementById('bEpWrap');
  epW.style.display = isTV ? 'block' : 'none';
  if (isTV && m.tmdb_id) bLoadSeasons(m);

  SwipeSheet.attach(document.getElementById('modalDragHandle'), document.getElementById('modCard'), closeMod);
  document.getElementById('modBg').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeMod() {
  document.getElementById('modBg').classList.remove('open');
  document.body.style.overflow = '';
  _curMovie = null;
}

async function bLoadSeasons(m) {
  var sel = document.getElementById('bEpSel');
  var list = document.getElementById('bEpList');
  sel.innerHTML = '';
  list.innerHTML = '<div class="ep-loading">Loading episodes…</div>';
  try {
    var d = await TMDB.tvDetails(m.tmdb_id);
    var seasons = (d.seasons||[]).filter(function(s){ return s.season_number > 0; });
    if (!seasons.length) { list.innerHTML='<div class="ep-loading">No seasons found.</div>'; return; }
    sel.innerHTML = seasons.map(function(s){
      return '<option value="'+s.season_number+'">Season '+s.season_number+' ('+s.episode_count+' eps)</option>';
    }).join('');
    bLoadEps(1);
  } catch(e) { list.innerHTML='<div class="ep-loading">Could not load episodes.</div>'; }
}

async function bLoadEps(season) {
  var list = document.getElementById('bEpList');
  if (!list||!_curMovie) return;
  list.innerHTML = '<div class="ep-loading">Loading…</div>';
  try {
    var d  = await TMDB.fetch('/tv/'+_curMovie.tmdb_id+'/season/'+season);
    var eps = d.episodes || [];
    if (!eps.length) { list.innerHTML='<div class="ep-loading">No episodes.</div>'; return; }
    var sn = parseInt(season), h = '';
    for (var i=0; i<eps.length; i++) {
      var ep=eps[i], en=ep.episode_number;
      var thumb = ep.still_path ? 'https://image.tmdb.org/t/p/w300'+ep.still_path : '';
      h += '<div class="ep-row" onclick="bPlayEp('+sn+','+en+')">'
        +'<div class="ep-thumb">'
        +(thumb ? '<img src="'+thumb+'" alt="" loading="lazy"><div class="ep-play-ov">&#9654;</div>'
                : '<div class="ep-thumb-ph">&#9654;</div>')
        +'</div>'
        +'<div class="ep-info"><div class="ep-title-row">'
        +'<span class="ep-name">'+en+'. '+(ep.name||'Episode '+en)+'</span>'
        +(ep.runtime ? '<span class="ep-rt">'+ep.runtime+'m</span>' : '')
        +'</div>'
        +(ep.overview ? '<div class="ep-ov">'+ep.overview+'</div>' : '')
        +'</div></div>';
    }
    list.innerHTML = h;
  } catch(e){ list.innerHTML='<div class="ep-loading">Could not load.</div>'; }
}

function bPlayEp(season, episode) {
  var m=_curMovie; if(!m) return;
  var p = new URLSearchParams();
  if(m.id) p.set('id',m.id); if(m.tmdb_id) p.set('tmdb_id',m.tmdb_id);
  p.set('type','tv'); p.set('season',season); p.set('episode',episode);
  p.set('title',m.title||''); p.set('year',m.year||'');
  p.set('poster',m.poster_url||''); p.set('backdrop',m.backdrop_url||'');
  p.set('age',m.age_rating||''); p.set('quality',m.quality||'');
  closeMod();
  location.href = 'XwerseMovies_Player.html?'+p.toString();
}

// ── UTILITY ──────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeMod();
  // Ctrl+K / Cmd+K — focus search from anywhere
  if ((e.ctrlKey||e.metaKey) && e.key==='k') {
    e.preventDefault(); document.getElementById('searchInput').focus();
  }
});
</script>
