  if (OB.phase === 'quiz') return renderQuiz();
  const n = PG.S.length, sec = PG.S[OB.step], last = OB.step === n - 1;
  $('ppRoot').innerHTML = `
    <div class="pp-card">
      <h2>🤝 ${PG.esc(PG.t('onbTitle'))}</h2>
      <div class="pp-muted">${PG.esc(PG.t('onbSub'))}</div>
      <div style="margin-top:14px">${PG.langBar('obLang')}</div>
      <div class="pp-muted">${PG.esc(PG.t('step', { n: OB.step + 1, m: n }))}</div>
      <div class="ob-prog"><i style="width:${Math.round((OB.step + 1) / n * 100)}%"></i></div>
      ${PG.sectionHtml(sec, PG.lang())}
      ${last ? `<label class="ob-o ${OB.agree ? 'on' : ''}"><input type="checkbox" ${OB.agree ? 'checked' : ''} onchange="OB.agree=this.checked;renderJoin(true)"><span>${PG.esc(PG.t('agree'))}</span></label>` : ''}
      <div class="ob-nav">
        <button class="pp-btn sec" ${OB.step === 0 ? 'disabled' : ''} onclick="obStep(-1)">← ${PG.esc(PG.t('back'))}</button>
        ${last ? `<button class="pp-btn" ${OB.agree ? '' : 'disabled'} onclick="obQuiz()">${PG.esc(PG.t('startQuiz'))} →</button>` : `<button class="pp-btn" onclick="obStep(1)">${PG.esc(PG.t('next'))} →</button>`}
      </div>
    </div>`;
}
function obLang(l) { PG.setLang(l); if (OB.phase === 'quiz') { obQuiz(); } else renderJoin(true); }
function obStep(d) { OB.step = Math.max(0, Math.min(PG.S.length - 1, OB.step + d)); renderJoin(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }
async function obQuiz() {
  OB.phase = 'quiz'; OB.ans = {}; OB.result = null;
  $('ppRoot').innerHTML = '<div class="skel" style="height:200px"></div>';
  const q = await api({ action: 'quiz', lang: PG.lang() });
  if (!q || q.error || !q.questions) { OB.phase = 'read'; toast('❌ ' + ((q && q.error) || 'Could not load the quiz')); renderJoin(true); return; }
  OB.quiz = q; renderQuiz(); window.scrollTo({ top: 0 });
}
function obPick(id, i) { OB.ans[id] = i; renderQuiz(true); }
function renderQuiz(keepScroll) {
  const y = window.scrollY, q = OB.quiz, R = OB.result;
  $('ppRoot').innerHTML = `
    <div class="pp-card">
      <h2>📝 ${PG.esc(PG.t('quizTitle'))}</h2>
      <div class="pp-muted">${PG.esc(PG.t('quizSub', { n: q.total, p: q.pass }))}</div>
      <div style="margin-top:14px">${PG.langBar('obLang')}</div>
      ${R && !R.passed ? `<div class="ob-bad" style="margin-bottom:14px">${PG.esc(PG.t('failed', { c: R.correct, n: R.total, p: R.pass }))}<br>${(R.wrong || []).map(tp => { const idx = PG.S.findIndex(x => x.id === tp); return idx < 0 ? '' : `<button class="pp-btn sec" style="margin:6px 6px 0 0;padding:7px 12px;font-size:.8rem" onclick="OB.phase='read';OB.step=${idx};renderJoin(true);window.scrollTo(0,0)">📖 ${PG.esc(PG.S[idx].t[PG.lang()])}</button>`; }).join('')}</div>` : ''}
      ${q.questions.map((x, n) => `<div class="ob-q"><b>${n + 1}. ${PG.esc(x.q)}</b>${x.o.map(o => `<label class="ob-o ${OB.ans[x.id] === o.i ? 'on' : ''}"><input type="radio" name="q_${x.id}" ${OB.ans[x.id] === o.i ? 'checked' : ''} onchange="obPick('${x.id}',${o.i})"><span>${PG.esc(o.t)}</span></label>`).join('')}</div>`).join('')}
      <div class="ob-nav">
        <button class="pp-btn sec" onclick="OB.phase='read';renderJoin(true);window.scrollTo(0,0)">← ${PG.esc(PG.t('retry'))}</button>
        <button class="pp-btn" id="joinBtn" ${OB.busy ? 'disabled' : ''} onclick="doJoin()">${PG.esc(PG.t('submit'))}</button>
      </div>
    </div>`;
  if (keepScroll) window.scrollTo(0, y);
}
async function doJoin() {
  const q = OB.quiz;
  if (q.questions.some(x => OB.ans[x.id] === undefined)) { toast('⚠️ ' + PG.t('answered')); return; }
  OB.busy = true; const b = $('joinBtn'); b.disabled = true; b.textContent = PG.t('joining');
  const d = await api({ action: 'join', agree: OB.agree, answers: q.questions.map(x => ({ id: x.id, a: OB.ans[x.id] })) });
  OB.busy = false;
  if (d && d.ok) { toast('🎉 ' + PG.t('passed')); await init(); window.scrollTo(0, 0); return; }
  if (d && d.result === 'quiz_failed') { OB.result = { passed: false, correct: d.correct, total: d.total, pass: d.pass, wrong: d.wrong }; renderQuiz(); window.scrollTo(0, 0); return; }
  b.disabled = false; b.textContent = PG.t('submit');
  toast(d && d.result === 'unverified' ? '❌ Verify your email first' : '❌ ' + ((d && d.error) || 'Could not join, try again'));
}

function renderDash(s) {
  const t = s.totals;
  const banned = s.status !== 'active';
  $('ppRoot').innerHTML = `
    ${banned ? `<div class="pp-card" style="border-color:#E50914"><h2>⚠️ Account on ${esc(s.status)}</h2><div class="pp-muted">Your account is currently ${esc(s.status)}. New views are not being counted. Contact us from the Contact page if you think this is a mistake.</div></div>` : ''}
    <div class="pp-card">
      <h2>Your partner code &nbsp;<span class="pp-code">${esc(s.code)}</span></h2>
      <div class="pp-muted">Every link below already contains it. Share only these links.</div>
    </div>
    <div class="pp-bar">
      ${[1, 7, 30].map(n => `<button class="fbtn ${RANGE === n ? 'on' : ''}" onclick="setRange(${n})">${n === 1 ? 'Today' : 'Last ' + n + ' days'}</button>`).join('')}
    </div>
    <div class="pp-stats">
      <div class="pp-stat"><b>${t.visits}</b><span>LINK VISITS</span></div>
      <div class="pp-stat"><b>${t.signups}</b><span>NEW VIEWERS LINKED</span></div>
      <div class="pp-stat"><b>${t.views}</b><span>COUNTED VIEWS</span></div>
      <div class="pp-stat est"><b>≈ ${usd(t.est_usd)}</b><span>ESTIMATED EARNINGS*</span></div>
    </div>
    <div class="pp-muted" style="margin:-6px 0 16px">*Estimate only, from counted views. Final amount depends on the real ad revenue and is fixed at the weekly settlement (Sunday). Today's numbers may still change.</div>

    <div class="pp-card"><h2>🔗 Your links</h2>
      <div class="pp-muted" style="margin-bottom:12px">Pick a title, copy your link and share it.</div>
      <div class="pp-grid" id="ppLinks">${TITLES.length ? '' : '<div class="pp-muted">No titles are open for promotion right now. Check back soon.</div>'}</div>
    </div>

    <div class="pp-card"><h2>📊 By title</h2>
      ${s.titles.length ? `<table class="pp"><tr><th>Title</th><th>Views</th><th>Est.</th></tr>${s.titles.map(x => `<tr><td>${esc((META[x.media_type + ':' + x.tmdb_id] || {}).title || ('#' + x.tmdb_id))}</td><td>${x.views}</td><td>${usd(x.est)}</td></tr>`).join('')}</table>` : '<div class="pp-muted">No counted views in this period yet.</div>'}
    </div>
    <div class="pp-card"><h2>📅 By day (UTC)</h2>
      ${s.days.length ? `<table class="pp"><tr><th>Day</th><th>Views</th><th>Est.</th></tr>${s.days.map(x => `<tr><td>${esc(x.day)}</td><td>${x.views}</td><td>${usd(x.est)}</td></tr>`).join('')}</table>` : '<div class="pp-muted">Nothing yet.</div>'}
    </div>
    <div class="pp-card"><h2>🌍 Viewer countries</h2>
      <div class="pp-muted">${s.countries.length ? s.countries.map(c => `${esc(c.country)}: ${c.views}`).join(' &nbsp;·&nbsp; ') : 'Nothing yet.'}</div>
    </div>
    ${payoutCard()}
    </div>`;
  paintLinks();
}

function payoutCard() {
  const w = WAL && WAL.wallet, r = (WAL && WAL.rules) || {};
  if (!w) return '<div class="pp-card"><h2>💸 Payouts</h2><div class="pp-muted">Could not load your balance right now.</div></div>';
  const open = w.payouts.some(x => x.status === 'requested');
  const st = { requested: '⏳ In review', paid: '✅ Paid', rejected: '❌ Rejected' };
  return `<div class="pp-card"><h2>💸 Payouts</h2>
    <div class="pp-stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="pp-stat est"><b>${usd(w.available)}</b><span>AVAILABLE TO WITHDRAW</span></div>
      <div class="pp-stat"><b>${usd(w.held + w.draft)}</b><span>WAITING (settlement / hold)</span></div>
      <div class="pp-stat"><b>${usd(w.paid)}</b><span>PAID OUT</span></div>
    </div>
    <div class="pp-muted">Money from each week becomes available after we are paid by the ad network and a ${r.hold_days || 14}-day safety hold. Minimum payout: ₹${r.min_inr || 500} (UPI) or $${r.min_usd || 5} (USDT). The ₹ amount uses the rate on payout day. Your first payout is checked by hand.</div>
    <div class="pp-bar" style="margin-top:14px">
      <select id="pMethod" class="fbtn" style="padding:8px 10px"><option value="upi">UPI</option><option value="usdt_trc20">USDT · TRC20</option><option value="usdt_bep20">USDT · BEP20</option></select>
      <input id="pAddr" class="fbtn" style="flex:1;min-width:200px;padding:8px 12px;text-align:left" placeholder="${WAL.method ? 'Saved: ' + esc(WAL.address_masked) + ' — enter new to change' : 'UPI ID (name@bank) or wallet address'}" autocomplete="off">
      <button class="pp-btn sec" onclick="savePayout()">Save</button>
      <button class="pp-btn" onclick="reqPayout()" ${open || WAL.status !== 'active' ? 'disabled' : ''}>Request payout</button>
    </div>
    ${w.weeks && w.weeks.length ? `<h2 style="margin-top:18px;font-size:.92rem">Weekly earnings</h2><table class="pp"><tr><th>Week</th><th>Amount</th><th>Status</th></tr>${w.weeks.map(x => `<tr><td>${esc(x.week_start)} → ${esc(x.week_end)}</td><td>${usd(x.amount_usd)}</td><td>${{ checking: '🔎 Being checked', approved: '✅ Approved · waiting for the ad network', confirmed: '✅ Confirmed' }[x.state] || ''}</td></tr>`).join('')}</table>` : ''}
    ${w.payouts.length ? `<table class="pp" style="margin-top:12px"><tr><th>Date</th><th>Amount</th><th>Via</th><th>Status</th></tr>${w.payouts.map(x => `<tr><td>${esc((x.created_at || '').slice(0, 10))}</td><td>${usd(x.amount_usd)}</td><td>${esc(x.method)}</td><td>${st[x.status] || esc(x.status)}${x.txn_ref ? ' · ' + esc(x.txn_ref) : ''}</td></tr>`).join('')}</table>` : ''}
  </div>`;
}
async function savePayout() {
  const d = await api({ action: 'payout_save', method: $('pMethod').value, address: $('pAddr').value });
  toast(d && d.ok ? '✅ Payout details saved' : '❌ ' + ((d && d.error) || 'Could not save'));
  if (d && d.ok) { await loadDash(); }
}
async function reqPayout() {
  if (!confirm('Request payout of your full available balance?')) return;
  const d = await api({ action: 'payout_request' });
  toast(d && d.ok ? '✅ Request sent. We will check and pay it.' : '❌ ' + ((d && d.error) || 'Could not request'));
  await loadDash();
}
function paintLinks() {
  const g = $('ppLinks'); if (!g || !TITLES.length) return;
  g.innerHTML = TITLES.map((t, i) => {
    const m = META[t.media_type + ':' + t.tmdb_id] || {};
    return `<div class="pp-t"><img loading="lazy" src="${esc(m.poster || '/favicon.png')}" alt=""><div class="n">${esc(m.title || '#' + t.tmdb_id)}</div><div class="m">${t.media_type === 'tv' ? 'Series' : 'Film'}${m.year ? ' · ' + esc(m.year) : ''}</div><div class="a"><button onclick="copyT(${i})">Copy link</button><button onclick="shareT(${i})">WhatsApp</button></div></div>`;
  }).join('');
}
async function loadMeta(list) {
  await Promise.all(list.map(async t => {
    const k = t.media_type + ':' + t.tmdb_id; if (META[k]) return;
    try {
      const d = await TMDB.fetch('/' + (t.media_type === 'tv' ? 'tv' : 'movie') + '/' + t.tmdb_id);
      if (d) META[k] = { title: d.title || d.name, year: (d.release_date || d.first_air_date || '').slice(0, 4), poster: TMDB.img(d.poster_path, 'w342') };
    } catch (e) {}
  }));
}

async function setRange(n) { RANGE = n; await loadDash(); }
async function loadDash() {
  const to = new Date(), from = new Date(Date.now() - (RANGE - 1) * 864e5);
  const s = await api({ action: 'stats', from: dayStr(from), to: dayStr(to) });
  if (!s || s.error) { $('ppRoot').innerHTML = `<div class="pp-card"><div class="pp-muted">Could not load your dashboard. ${esc((s && s.error) || '')} <button class="pp-btn sec" onclick="loadDash()">Retry</button></div></div>`; return; }
  await loadMeta(s.titles.map(x => ({ tmdb_id: x.tmdb_id, media_type: x.media_type })));
  WAL = await api({ action: 'wallet' });
  renderDash(s);
}
async function init() {
  ME = await api({ action: 'me' });
  if (!ME || ME.error) { $('ppRoot').innerHTML = `<div class="pp-card"><div class="pp-muted">${esc((ME && ME.error) || 'Could not load')} <button class="pp-btn sec" onclick="init()">Retry</button></div></div>`; return; }
  if (!ME.joined) { renderJoin(ME.verified); return; }
  const tt = await api({ action: 'titles' });
  TITLES = (tt && tt.titles) || [];
  await loadMeta(TITLES);
  await loadDash();
}

(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;
  await initNavAvatar('navAvatar');
  await initNavAvatar('mnavProfileAvatar');
  if (typeof XvNotif !== 'undefined') XvNotif.init(currentUser.id);
  await init();
})();
</script>
</body>
</html>
